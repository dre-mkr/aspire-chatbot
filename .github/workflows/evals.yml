name: evals

# Retrieval quality is cheap enough to gate every push: it is embeddings only,
# no generation. Answer quality costs model calls, so it runs nightly and on
# demand rather than per commit.
#
# Baselines are recorded in reports/P8-ai-pipeline.md. If a threshold here
# starts failing, compare against that table before changing the threshold.

on:
  push:
    paths:
      - "backend/app/**"
      - "backend/data/knowledge_base.csv"
      - "backend/evals/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/data/knowledge_base.csv"
      - "backend/evals/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      answers:
        description: "Also run answer-quality evals (costs model calls)"
        type: boolean
        default: false

jobs:
  retrieval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      # The golden set names real KB row ids. If the corpus is edited and a row
      # is renamed or removed, every later number becomes meaningless — so this
      # is checked first and fails loudly.
      - name: Verify golden ids still exist
        run: uv run python -m evals.run --verify-ids

      - name: Build the vector store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDINGS_PROVIDER: openai
          EMBEDDINGS_MODEL: text-embedding-3-large
        run: uv run python -m app.ingest

      # Baseline 2026-08-03: hit_rate 1.00, MRR 0.947 at k=4 (60 cases).
      # 0.95 leaves headroom for corpus churn without hiding a real regression.
      - name: Retrieval quality
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDINGS_PROVIDER: openai
          EMBEDDINGS_MODEL: text-embedding-3-large
        run: uv run python -m evals.run --retrieval --fail-under 0.95 --json evals-retrieval.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-retrieval
          path: backend/evals-retrieval.json

  answers:
    # Model calls cost money, so: nightly, or explicitly asked for.
    if: github.event_name == 'schedule' || inputs.answers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Build the vector store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m app.ingest

      # Baseline 2026-08-03: refusal correctness 10/10 (LLM judge).
      # This is the child-safety gate — an ungrounded confident answer about
      # interest, fees or account terms is the worst failure this product has.
      # It does not get a tolerance below 1.0 without a written decision.
      - name: Refusal correctness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m evals.run --answers --kind refuse --fail-under 1.0 --json evals-refusals.json

      # Baseline 2026-08-03: retrieval 18/18, grounding 18/18 on exact-term cases.
      - name: Grounding on exact-term questions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m evals.run --answers --kind exact --json evals-exact.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-answers
          path: backend/evals-*.json
