name: Deploy

# Every push to main updates the VPS. The build itself happens on the box —
# this job only opens an SSH session and runs deploy/update.sh, so the Actions
# log is that script's output.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are serialised. Cancelling an in-flight one is worse than queueing:
# it could stop between the asset swap and the service restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing used to gate this workflow. 487 backend tests and a clean typecheck
  # existed and every push to main reached production without running any of
  # them -- on a government service used by children. The deploy job now depends
  # on this one, so a red build never ships.
  #
  # Deliberately fast and hermetic: no database, no Valkey, no model calls. The
  # eval harness needs an API key and lives in evals.yml, which gates on
  # retrieval quality separately.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `lfs: true` because the two ASPIRE story videos are tracked with git-lfs
      # and a plain checkout leaves 130-byte pointer stubs in their place.
      # `test_the_file_is_video_and_not_an_lfs_pointer` then fails -- correctly,
      # it is doing exactly its job -- and takes the whole gate down with it.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # --- frontend ---
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # bun, not npm, and that is the point (P0-007). `deploy/update.sh` runs
      # `bun install --frozen-lockfile` on the box; CI running `npm ci` against
      # a package-lock.json meant local, CI and production could each resolve a
      # different dependency tree from the same commit. There is one lockfile
      # now and both places install from it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: bunx tsc --noEmit
      # A gate, not a report (P0-009 is closed). `biome check` covers lint,
      # formatting and import order in one pass, and all three are clean --
      # the two `useSemanticElements` diagnostics that used to block this are
      # suppressed at the two call sites with the reason written down, and the
      # 38 formatting diffs were fixed in their own no-behaviour commit.
      - name: Lint, format and import order
        working-directory: frontend
        run: bunx biome check
      - name: Production build
        working-directory: frontend
        # The real deploy builds with the site URL. Without it the bundle is
        # emitted pointing at http://localhost:8000 (P6-006) -- harmless here
        # because this artefact is discarded, but it must not look like a pass
        # for a build that would ship broken.
        env:
          VITE_ASPIRE_API_URL: https://aspire.eccugenai.app
        run: bunx vite build

      # --- backend ---
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      # The backend had no linter at all, and that is how two NameErrors reached
      # production code in `app/main.py`: `/ready` and `/debug/timings` both
      # raised on every call, `ruff` reports them in under a second, and the
      # 517-test suite passed with them live because no test imports those lines.
      #
      # `F` is pyflakes -- undefined names, unused imports, f-string mistakes.
      # `E9` is syntax and IO errors. Deliberately NOT the full default rule set:
      # this is a correctness gate, not a style gate, and a style gate bolted onto
      # 128 existing files would be noise that teaches people to skip the step.
      # Widen it later on purpose, not by accident.
      - name: Backend lint (correctness only)
        working-directory: backend
        run: uvx ruff check app/ --select F,E9
      # Split fast from slow (P0-010). The whole suite is ~20 minutes, almost
      # all of it in bcrypt rounds and model/embedding fixtures, and a gate
      # nobody wants to wait for is a gate people learn to skip.
      #
      # `-m "not slow"` runs first and fails fast, so the common case -- a typo,
      # a broken import, a logic error -- is reported in well under a minute.
      # The slow half still runs, and still gates the deploy; it just does not
      # stand between the author and the news that something is obviously wrong.
      - name: Backend tests (fast)
        working-directory: backend
        env:
          SESSION_SECRET: ci-only-secret-not-used-for-anything
          # Namespaced per run so two concurrent CI jobs cannot count against
          # each other's rate limits (P11-001).
          ASPIRE_CACHE_NAMESPACE: ci-${{ github.run_id }}-
        run: uv run pytest -q -m "not slow"
      - name: Backend tests (slow)
        working-directory: backend
        env:
          SESSION_SECRET: ci-only-secret-not-used-for-anything
          ASPIRE_CACHE_NAMESPACE: ci-${{ github.run_id }}-
        run: uv run pytest -q -m slow

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run the update script on the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pinning the host key rather than disabling the check: a runner that
          # accepts any key will happily hand this private key to whoever
          # answers on that address.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_deploy \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              '/root/aspire/deploy/update.sh'
