# ASPIRE hangman — guest bank (mixed audience)
#
# Eight words that a parent, a teacher and a sixth-former all need in the same
# form. Read as plain adult prose, since the same card may be in front of a
# teacher explaining it or a teenager guessing alone, but nothing here assumes a
# lesson on compounding or the stock exchange has already happened — those
# belong to the Orion bank.
#
# Every definition is grounded in a row of the project knowledge base, cited by
# row id in `source_document`. Nothing about the ASPIRE programme itself is
# claimed here — no amounts, ages, eligibility rules or partner names. Those
# belong in content whose sourcing has been checked line by line, and none of
# them are guessable one letter at a time anyway.
#
# Editing rules the loader enforces: `word` is uppercase A–Z, a single word,
# with at least three DIFFERENT letters, and neither `hint` nor `definition`
# may contain the word itself as a SUBSTRING. That last one bites on plurals and
# derived forms — "expenses", "receipts", "deposits" and "scammers" all contain
# their own answer and will get the file rejected. Check after any reword.
#
# The hint is a category nudge, saying what kind of thing the answer is rather
# than what it means; the definition is the teaching, shown last and used again
# after a correct guess.

id: hangman-guest-01
game_type: hangman
language: en
title: Money words guest meets
source: ASPIRE knowledge base (data/knowledge_base.csv)

closing:
  lead: Five words for money moving, three for the risk around it.
  text: >-
    Five of these are money simply moving and being recorded — what comes in,
    what goes out, what you hand across the counter, the slip that proves it and
    the notes it is all counted in. The other three are about risk, and each has
    its own answer: judge borrowing by the total repayment, pay a premium every
    month so one bad day does not sink you, and slow down when somebody is
    rushing you. Nobody is born knowing these. They are learned once and used
    for the rest of a life.

entries:
  - id: hangman-guest-01-income
    language: en
    word: INCOME
    hint: a money-in word — a job, a business and a savings account each produce one
    definition: >-
      Money coming in. It can be wages from a job, profit from a business,
      interest from savings, dividends from shares, or a gift or an allowance.
      It is the fuel for everything else you do with money, which is why a
      budget starts by writing down what is coming in.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-014, FIN-075)

  - id: hangman-guest-01-expense
    language: en
    word: EXPENSE
    hint: the going-out side of a budget, and the side most people guess too low
    definition: >-
      Money going out. Food, transport, phone data, school supplies and rent all
      count. When what goes out is bigger than what comes in, you run short every
      month and have to borrow or dip into savings to close the gap. Track a
      full month and the small purchases usually total far more than you guessed.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-015, FIN-016, FIN-076)

  - id: hangman-guest-01-deposit
    language: en
    word: DEPOSIT
    hint: a banking action, and the opposite of a withdrawal
    definition: >-
      Putting money into your account. You can do it at a bank counter with a
      slip, at some ATMs, or by having your salary paid straight in. Check the
      stamped paperwork matches the amount before you walk away.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-100, FIN-101, FIN-102)

  - id: hangman-guest-01-receipt
    language: en
    word: RECEIPT
    hint: a small piece of paper worth keeping — a shop hands you one, a teller stamps one
    definition: >-
      The printed proof of what you paid. Keep it for returns and warranties,
      for checking your bank statement against what you actually bought, and for
      tracking spending accurately. In a business it is also your evidence of
      costs.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-101, FIN-167)

  - id: hangman-guest-01-currency
    language: en
    word: CURRENCY
    hint: eight Eastern Caribbean members share one of these — ours is the EC dollar
    definition: >-
      The money a country or a region uses. Ours is the Eastern Caribbean
      dollar, written EC$ and shortened to XCD, issued by the Eastern Caribbean
      Central Bank whose head office is in Basseterre. It has been fixed at
      EC$2.70 to one United States dollar since 7 July 1976, which is why
      import prices here stay predictable and savings are protected from
      sudden swings.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-004, FIN-033, FIN-035)

  - id: hangman-guest-01-loan
    language: en
    word: LOAN
    hint: a credit-and-debt word — you take one out, then repay it over a set term
    definition: >-
      A lump sum you receive, called the principal, and agree to repay over a
      set term in regular instalments that cover part of the principal and part
      of the interest. Judge the cost by the total repayment rather than the
      monthly figure — a longer term means a smaller payment but more total
      interest paid in the end.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-173, FIN-174)

  - id: hangman-guest-01-insurance
    language: en
    word: INSURANCE
    hint: one of the four ways of handling risk — the one that hands the risk to somebody else
    definition: >-
      A contract where you pay a regular premium and the insurer agrees to cover
      certain large losses. Many people pay in, few claim at any one time, and
      that pooling is what makes a big loss survivable. It transfers risk to
      somebody else rather than removing it.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-249, FIN-250)

  - id: hangman-guest-01-scam
    language: en
    word: SCAM
    hint: a fraud-and-safety word — the Eastern Caribbean Central Bank warned about these on 21 May 2025
    definition: >-
      A trick designed to take your money or your personal information. The
      method relies on pressure — rushing you, flattering you or frightening you
      so that you act before you think. The single biggest warning sign is a
      promise of high returns with little or no risk, because that combination
      does not exist in legitimate finance.
    difficulty_band: warmup
    persona_bands: [guest]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-230, FIN-231, FIN-232)
