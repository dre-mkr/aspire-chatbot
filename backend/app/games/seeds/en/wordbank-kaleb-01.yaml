# ASPIRE word scramble — Kaleb set 1 (ages 9-12)
#
# WRITTEN FOR KALEB, NOT INHERITED FROM SKYE. Until now this band was served
# Stella's bank, which is COIN, BANK, SPEND, GOAL -- the 5-8 allow-list, word
# for word. Kaleb's card names that failure exactly: "simplifying the words
# reads as a demotion and loses this reader", and "default to the OLDER end of
# this band. This reader is in secondary school."
#
# So these are the words his ladder actually opens: interest, budget, deposit,
# earn -- real terms, defined in passing, never in a box. `loan`, `compound`,
# `dividend` and `portfolio` stay out; they are banned at 9-12 and the gate
# would strip them from the hint anyway.

