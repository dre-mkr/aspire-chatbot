# ASPIRE quiz ladder — Stella set (ages 5–12)
#
# Six questions written natively for Stella's band, not simplified from an
# older set at runtime. Everything concrete and physical: the notes in a hand,
# a bank counter, food on a plate, a jar that fills up week by week. No
# percentages, no rates, no interest — those belong to Orion.
#
# Every fact here traces to a row of the project's verified knowledge base at
# backend/data/knowledge_base.csv, and each entry names its rows in
# `source_document`. Every row named carries audience=child. Nothing about the
# ASPIRE programme's own rules — amounts, ages, eligibility — appears in this
# file, because a quiz card is the wrong place to be approximately right.
#
# The corpus says the ECCB *issues* the EC dollar, so these cards say it comes
# from the ECCB rather than that the ECCB makes or prints it — otherwise the
# currency card would quietly contradict the bank card, where "a machine that
# prints new money" is a wrong answer.

id: millionaire-stella-01
game_type: millionaire
language: en
title: Notes, needs and saving
source: ASPIRE knowledge base

closing:
  lead: Keep some back. Put it somewhere safe.
  text: >-
    All six questions are about the same money — the EC dollar in your hand.
    Keep some of it back instead of spending every bit, and put what you keep
    somewhere safe like a bank. Pay for your needs first, and a few dollars a
    week turns into a lot by the end of the year.

entries:
  - id: millionaire-stella-01-currency
    language: en
    question: What is the money we use in Saint Kitts and Nevis called?
    choices:
      - The United States dollar
      - The Eastern Caribbean dollar
      - The British pound
      - The Jamaican dollar
    answer_index: 1
    explanation: >-
      Our money is the Eastern Caribbean dollar. We write EC$ in front of the
      number, like EC$10. It comes from the Eastern Caribbean Central Bank, and
      that bank's head office is right here in Basseterre.
    topic: Our money
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-004)

  - id: millionaire-stella-01-biggest-note
    language: en
    question: Which EC dollar note is worth the most?
    choices:
      - EC$20
      - EC$50
      - EC$100
      - EC$200
    answer_index: 2
    explanation: >-
      There are five EC dollar notes: EC$5, EC$10, EC$20, EC$50 and EC$100. The
      EC$100 is worth the most, and there is no EC$200 note at all. Feel a note
      between your fingers and you will notice it is not paper. It is a thin
      bendy plastic called polymer, so it stays cleaner and lasts much longer.
    topic: EC dollar notes
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-007)

  - id: millionaire-stella-01-what-saving-is
    language: en
    question: >-
      Shanice is given EC$20. She puts EC$5 away and spends the rest. What is
      she doing with the EC$5?
    choices:
      - Spending it
      - Giving it away
      - Lending it to a friend
      - Saving it
    answer_index: 3
    explanation: >-
      Saving means keeping some of your money instead of spending all of it.
      Shanice kept EC$5 back, so that EC$5 is saved and it is still hers. She
      can use it later for something bigger, or on a day when something goes
      wrong and she needs it. Even small amounts add up if you do it every time.
    topic: What saving is
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-049)

  - id: millionaire-stella-01-what-a-bank-is
    language: en
    question: What is a bank?
    choices:
      - A place that keeps your money safe until you need it
      - A shop that sells food and drinks
      - A place where you borrow books
      - A machine that prints new money
    answer_index: 0
    explanation: >-
      A bank keeps your money safe for you. You can put money in, and you can
      take money out when you need it. That is safer than keeping all your cash
      at home, where it can be lost or taken. Banks also lend money to people
      and to businesses.
    topic: What a bank does
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-096)

  - id: millionaire-stella-01-needs-and-wants
    language: en
    question: Which one of these is a need?
    choices:
      - A new football
      - Food to eat
      - Sweets
      - A toy car
    answer_index: 1
    explanation: >-
      A need is something you must have to live, like food, water, somewhere to
      live, clothes and the things you take to school. A want is something you
      would enjoy but could live without, like sweets, games and toys. Wants are
      not bad. You just cannot have everything at once, so you pay for your
      needs first and buy the wants after.
    topic: Needs and wants
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-077, FIN-022)

  - id: millionaire-stella-01-small-amounts-add-up
    language: en
    question: Jerome saves EC$5 every week for a whole year. About how much will he have?
    choices:
      - EC$60
      - EC$100
      - EC$260
      - EC$500
    answer_index: 2
    explanation: >-
      A year has 52 weeks, so EC$5 kept back every week comes to about EC$260.
      Jerome never had to find a big pile of money. He just did a small thing
      over and over. That is why saving a little every time beats waiting until
      you have a lot to save.
    topic: Small amounts add up
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-061)
