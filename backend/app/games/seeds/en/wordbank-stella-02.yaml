# ASPIRE word scramble — Stella bank, set 2 (ages 5–12)
#
# A second bank for the same reader as `wordbank-stella-01`, not a replacement.
# A round serves a handful of a set's entries at random, so widening the pool is
# what stops the same child meeting the same word two afternoons running.
#
# Where set 1 was about looking after money once you have it, this one is about
# the decision that comes first: whether to part with it at all. Needs and wants,
# the price on the thing, the plan you make before the shop — then somewhere to
# put what you kept, and a portion for somebody else.
#
# Nothing here needs a percentage, a rate or compounding, and the word the 9–12
# card is allowed to use for money growing in a bank is deliberately absent too:
# this bank is read by five-year-olds, who are not given that word at all.
#
# EARN is not here. It is already `wordbank-stella-01-earn`, and a second copy
# would just make the same puzzle twice as likely. COST takes its place.
#
# Editing this file (same rules as warmup-01):
#   word        the answer, uppercase. Never leaves the server until revealed.
#   scramble    must be an anagram of `word` — CI asserts this on every entry.
#   hint        a CATEGORY nudge, not a definition. Becomes hint level 2.
#   definition  plain, roughly grade-2 reading level. Hint level 3, and what the
#               assistant teaches from after a correct answer. Must not contain
#               the word itself — CI asserts that too, on the letters alone, so
#               watch for a word hiding across a space.

id: wordbank-stella-02
game_type: word_scramble
language: en
title: More money words to unscramble
source: ASPIRE design project — Stella word bank, set 2

closing:
  lead: Ask what it is for, before you buy it.
  text: >-
    Money is mostly about choosing. Some things you must have and some things
    you would only like, and telling those two apart before you spend is most of
    the work. What is left over goes somewhere it cannot get lost.

entries:
  - id: wordbank-stella-02-need
    language: en
    word: NEED
    scramble: DENE
    hint: food, water and school shoes all belong in this group
    definition: something you must have to live and go to school
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-077)

  - id: wordbank-stella-02-want
    language: en
    word: WANT
    scramble: TWAN
    hint: a feeling, not a thing you must have
    definition: something you would enjoy having, but you could live without it
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-077, FIN-022)

  - id: wordbank-stella-02-cost
    language: en
    word: COST
    scramble: OTCS
    hint: a number, and you look for it before you buy
    definition: the amount of money you must pay to buy something
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-012)

  - id: wordbank-stella-02-plan
    language: en
    word: PLAN
    scramble: NALP
    hint: you make one before you start, not after
    definition: what you decide your money will do before you spend any of it
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-075)

  - id: wordbank-stella-02-jar
    language: en
    word: JAR
    scramble: RAJ
    hint: a thing rather than an action — some children keep three of them
    definition: a small pot at home where you drop your coins to keep them together
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-060, FIN-059)

  - id: wordbank-stella-02-safe
    language: en
    word: SAFE
    scramble: FEAS
    hint: it describes a place, not a thing you do
    definition: kept where it cannot be lost, taken or spent by mistake
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-058, ASP-071)

  - id: wordbank-stella-02-give
    language: en
    word: GIVE
    scramble: VEGI
    hint: an action word — and you do not ask for it back
    definition: to hand some of your money to a person who has less than you
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-060)
