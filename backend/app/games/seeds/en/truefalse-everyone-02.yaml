# ASPIRE true or false — general set 2 (the `everyone` persona)
#
# A second set for the reader who has not said who they are, so a round draws
# from a wider bank and playing twice is unlikely to repeat a statement. Same
# register as set 1: nothing a twelve-year-old could not follow, nothing an
# adult would find childish, and no item assuming the reader holds an account
# or earns a wage. The engine adapts by band rather than by rewriting a card at
# runtime — Stella's sets carry Stella's register and Orion's carry his — so
# this file stays deliberately in the middle and claims neither band.
#
# Where set 1 was authored from the design project, this one is written off the
# verified corpus. Every institutional, rate, tax or currency claim carries the
# knowledge base row it came from in `source_document`, and only rows the item
# actually leans on are listed; general financial definitions and plain
# arithmetic carry no row because they need none. Nothing about the ASPIRE
# programme itself — amounts, ages, eligibility, partners, account rules — is
# claimed here.
#
# Where a number appears it is quoted with the date attached, because a figure
# with no date is the thing that goes quietly wrong two years later. The item
# itself asserts the durable part and the level lives in the explanation, which
# is why these are `stable`: the floor existing is the claim, not its height. A
# percentage appears only where the arithmetic is shown beside it.
#
# The engine samples a round from every set a player can be served, so nothing
# here counts the questions, points at another item, or assumes the closing
# follows any particular one.
#
# `explanation` is the flat authoritative text and is exactly the `paragraphs`
# joined by a space. A client that can break an answer up uses the paragraphs;
# one that cannot still has the whole explanation.

id: truefalse-everyone-02
game_type: true_false
language: en
title: True or false
source: ASPIRE knowledge base — True or False (general, set 2)

closing:
  lead: Ask what stands behind it.
  text: >-
    Some of what steadies money here is written down and supervised — a fixed
    rate to the US dollar, a floor under what savings must earn, banks that
    answer to a regulator. Other arrangements rest on trust alone, and trust is
    not a guarantee, however well it has held so far. Knowing which kind you
    are dealing with, before the money moves, is most of staying safe.

entries:
  - id: tfe-02-peg
    statement: The EC dollar's value against the US dollar moves up and down from day to day.
    answer: false
    topic: The peg
    topic_line: " — one fixed rate, held on purpose."
    takeaway: The EC dollar is fixed to the US dollar, not floating against it.
    explanation: >-
      One US dollar is worth EC$2.70, and it has been worth exactly that since 7
      July 1976. A fixed rate like that is called a peg. It is the reason prices
      here do not jump about every time the news reports a currency move.
      Holding it steady is deliberate work: the Eastern Caribbean Central Bank
      holds reserves of US dollars and other foreign currency that back the EC
      dollar and let it defend the rate. The arithmetic never changes either. EC
      dollars into US dollars, divide by 2.70; US dollars into EC dollars,
      multiply by 2.70. So EC$27 is US$10, and it was US$10 last year as well.
    paragraphs:
      - >-
        One US dollar is worth EC$2.70, and it has been worth exactly that since
        7 July 1976. A fixed rate like that is called a peg.
      - >-
        It is the reason prices here do not jump about every time the news
        reports a currency move. Holding it steady is deliberate work: the
        Eastern Caribbean Central Bank holds reserves of US dollars and other
        foreign currency that back the EC dollar and let it defend the rate.
      - >-
        The arithmetic never changes either. EC dollars into US dollars, divide
        by 2.70; US dollars into EC dollars, multiply by 2.70. So EC$27 is
        US$10, and it was US$10 last year as well.
    difficulty_band: core
    persona_bands: [everyone]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-005, FIN-035, FIN-040)

  - id: tfe-02-savings-floor
    statement: >-
      Commercial banks here must pay at least a set minimum on the money in a
      savings account.
    answer: true
    topic: The savings floor
    topic_line: " — a legal minimum, not a good rate."
    takeaway: There is a floor under savings rates here, and a floor is not a target.
    explanation: >-
      The Eastern Caribbean Central Bank sets a minimum savings rate that
      commercial banks may not go below. It has been 2 percent a year since May
      2015, and the Monetary Council reaffirmed it in July 2025. Two percent a
      year works out at EC$2 for every EC$100 left sitting in the account for a
      year. That is not a fortune, but it does mean an ordinary savings account
      here cannot pay you nothing at all. It is a floor rather than a target,
      so what different banks actually offer is still worth comparing before you
      open anything. And a lower figure quoted somewhere is usually the average
      deposit rate across all kinds of deposit, which measures something
      different from the legal minimum on savings.
    paragraphs:
      - >-
        The Eastern Caribbean Central Bank sets a minimum savings rate that
        commercial banks may not go below. It has been 2 percent a year since
        May 2015, and the Monetary Council reaffirmed it in July 2025.
      - >-
        Two percent a year works out at EC$2 for every EC$100 left sitting in
        the account for a year. That is not a fortune, but it does mean an
        ordinary savings account here cannot pay you nothing at all.
      - >-
        It is a floor rather than a target, so what different banks actually
        offer is still worth comparing before you open anything. And a lower
        figure quoted somewhere is usually the average deposit rate across all
        kinds of deposit, which measures something different from the legal
        minimum on savings.
    difficulty_band: core
    persona_bands: [everyone]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-037, FIN-038, FIN-098, FIN-333)

  - id: tfe-02-sou-sou
    statement: >-
      A sou-sou gives your money the same protection as an account at a licensed
      bank.
    answer: false
    topic: Sou-sou and partner hand
    topic_line: " — real discipline, no safety net underneath it."
    takeaway: A sou-sou is a discipline tool, not a protected place to keep money.
    explanation: >-
      A sou-sou, or partner hand, is a rotating savings group: every member puts
      in a fixed amount each week and members take turns receiving the pot. What
      makes it work is the social commitment — letting down people you see every
      day is harder than breaking a promise to yourself. What it is not is
      protected. A sou-sou is not regulated, not insured and not guaranteed, and
      it pays no interest. If a member stops paying or the organiser disappears,
      there is no formal recourse. A licensed bank is supervised by the Eastern
      Caribbean Central Bank under the Banking Act, and it has to pay at least
      the minimum savings rate. So the sensible place for a sou-sou is alongside
      an account rather than instead of one.
    paragraphs:
      - >-
        A sou-sou, or partner hand, is a rotating savings group: every member
        puts in a fixed amount each week and members take turns receiving the
        pot. What makes it work is the social commitment — letting down people
        you see every day is harder than breaking a promise to yourself.
      - >-
        What it is not is protected. A sou-sou is not regulated, not insured and
        not guaranteed, and it pays no interest. If a member stops paying or the
        organiser disappears, there is no formal recourse.
      - >-
        A licensed bank is supervised by the Eastern Caribbean Central Bank
        under the Banking Act, and it has to pay at least the minimum savings
        rate. So the sensible place for a sou-sou is alongside an account rather
        than instead of one.
    difficulty_band: core
    persona_bands: [everyone]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-067, FIN-068, FIN-118, FIN-037)

  - id: tfe-02-income-tax
    statement: Saint Kitts and Nevis does not charge personal income tax on individuals.
    answer: true
    topic: Income tax here
    topic_line: " — no slice off earnings, and other taxes instead."
    takeaway: There is no personal income tax here, which is not the same as no tax.
    explanation: >-
      Saint Kitts and Nevis does not levy personal income tax on individuals,
      and has not since 1980. That is unusual internationally: in most countries
      a slice of what a person earns goes to the government before they ever see
      it. It does not mean nothing comes off earnings — employed people
      contribute to Social Security out of theirs — and the government still has
      to raise revenue, which it does mainly through taxes on what people buy
      and bring in, such as VAT and import and customs duties. Because there is
      no personal income tax, individuals here are not taxed on personal income
      the way residents of many other countries are. Rules can differ by product
      and can change, so the Inland Revenue Department is the place to confirm
      any particular situation.
    paragraphs:
      - >-
        Saint Kitts and Nevis does not levy personal income tax on individuals,
        and has not since 1980. That is unusual internationally: in most
        countries a slice of what a person earns goes to the government before
        they ever see it.
      - >-
        It does not mean nothing comes off earnings — employed people contribute
        to Social Security out of theirs — and the government still has to raise
        revenue, which it does mainly through taxes on what people buy and bring
        in, such as VAT and import and customs duties.
      - >-
        Because there is no personal income tax, individuals here are not taxed
        on personal income the way residents of many other countries are. Rules
        can differ by product and can change, so the Inland Revenue Department
        is the place to confirm any particular situation.
    difficulty_band: warmup
    persona_bands: [everyone]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-221, FIN-225, FIN-143, FIN-228)

  - id: tfe-02-voice-proof
    statement: >-
      A voice on the phone that sounds exactly like a relative's proves the call
      really is from that relative.
    answer: false
    topic: Scams that sound familiar
    topic_line: " — hang up, then call back on a number you already have."
    takeaway: A familiar voice is no longer evidence of who is speaking.
    explanation: >-
      A voice is no longer proof of anything. Fraudsters can clone the voice or
      the image of someone you trust well enough to make an urgent request
      believable, and the Eastern Caribbean Central Bank named fraud using
      artificial intelligence among the scams it warned citizens and residents
      about on 21 May 2025. The defence is a habit rather than a judgement,
      because judgement is exactly what the urgency is built to bypass. If a
      call asks for money urgently, hang up and call that person back on a
      number you already have. Anyone genuine will still be there in five
      minutes. If money has already gone, contact your bank straight away to try
      to stop or reverse the transfer, and report it to the police. Speed
      matters more than embarrassment.
    paragraphs:
      - >-
        A voice is no longer proof of anything. Fraudsters can clone the voice
        or the image of someone you trust well enough to make an urgent request
        believable, and the Eastern Caribbean Central Bank named fraud using
        artificial intelligence among the scams it warned citizens and residents
        about on 21 May 2025.
      - >-
        The defence is a habit rather than a judgement, because judgement is
        exactly what the urgency is built to bypass. If a call asks for money
        urgently, hang up and call that person back on a number you already
        have. Anyone genuine will still be there in five minutes.
      - >-
        If money has already gone, contact your bank straight away to try to
        stop or reverse the transfer, and report it to the police. Speed matters
        more than embarrassment.
    difficulty_band: warmup
    persona_bands: [everyone]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-236, FIN-231, FIN-240, FIN-245)

  - id: tfe-02-dormant
    statement: >-
      An account nobody touches for long enough can attract fees or have access
      restricted.
    answer: true
    topic: Dormant accounts
    topic_line: " — one small transaction a year keeps it awake."
    takeaway: An untouched account can go dormant, so use it once a year.
    explanation: >-
      An account with no activity for a long period can be classified as
      dormant. What follows is not dramatic, but it is inconvenient: fees may
      start, access may be restricted, and getting the account working again
      usually means reactivating it at a branch. The fix costs nothing. One
      small transaction a year — a few dollars in, or a small withdrawal — is
      enough to keep an account counted as active. It is worth knowing for any
      account that is opened and then left alone for years, which is the
      ordinary shape of long-term savings.
    paragraphs:
      - >-
        An account with no activity for a long period can be classified as
        dormant. What follows is not dramatic, but it is inconvenient: fees may
        start, access may be restricted, and getting the account working again
        usually means reactivating it at a branch.
      - >-
