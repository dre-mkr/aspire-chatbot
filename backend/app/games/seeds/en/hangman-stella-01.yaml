# ASPIRE hangman — Stella bank (ages 5–12)
#
# Eight money words a child of five to twelve already half knows, guessed one
# letter at a time. Every definition here is drawn from a row of the project
# knowledge base — the row id sits in each entry's `source_document` so a later
# editor can check the claim instead of trusting it. Nothing in this file states
# an ASPIRE programme rule: amounts, ages and eligibility belong to the bands
# that can read them, and none of them are guessable in four letters.
#
# Written for Stella's card: short sentences, words a seven-year-old uses, and
# no percentage, rate or compounding anywhere. Those belong to the Orion bank.
#
# Editing this file:
#   word        the answer, uppercase, at least three DIFFERENT letters. Never
#               leaves the server until it is revealed.
#   hint        a CATEGORY nudge, not a definition. Becomes hint level 1.
#   definition  plain, roughly grade-two reading level. Hint level 3, and what
#               the assistant teaches from after a correct answer.
# The loader rejects the file if either `hint` or `definition` contains the word
# itself, so check that before you commit a reword.

id: hangman-stella-01
game_type: hangman
language: en
title: Money words, one letter at a time
source: ASPIRE knowledge base (data/knowledge_base.csv)

closing:
  lead: Keep some. Spend some. Share some.
  text: >-
    All eight words belong to the same habit. Money comes to you, and you decide
    what each part of it is for before it disappears. Keep a little back every
    single time, put it somewhere safe, and watch what you are saving for get
    closer week by week.

entries:
  - id: hangman-stella-01-money
    language: en
    word: MONEY
    hint: the big one — every other word here is about it
    definition: >-
      What everybody agrees to take when you buy or sell something. In Saint
      Kitts and Nevis we use the Eastern Caribbean dollar.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-001, FIN-004)

  - id: hangman-stella-01-coin
    language: en
    word: COIN
    hint: something small and hard you can hold in your hand
    definition: >-
      A round piece of metal money. The ones you will see in your change are 5
      cents, 10 cents, 25 cents and the round EC$1.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-008)

  - id: hangman-stella-01-save
    language: en
    word: SAVE
    hint: an action word — what a piggy jar helps you do
    definition: >-
      To keep some of your money instead of using all of it, so you still have
      it later for something bigger or for a surprise. Even small amounts add up
      when you do it every time.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-049, FIN-061)

  - id: hangman-stella-01-spend
    language: en
    word: SPEND
    hint: an action word — this is the one that makes the money go away
    definition: >-
      To use your money to buy something. Pick things you will still be glad
      about next month, not just things that look good today.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-151)

  - id: hangman-stella-01-share
    language: en
    word: SHARE
    hint: an action word, and it needs another person
    definition: >-
      To give some of what you have to somebody else. In the three jars way of
      splitting your money, one whole jar is for this.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-060)

  - id: hangman-stella-01-bank
    language: en
    word: BANK
    hint: a place people go to, not a thing they do
    definition: >-
      A safe place that looks after your money for you. You can put money in,
      and you can take it out again when you need it.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-096, FIN-100, FIN-102)

  - id: hangman-stella-01-goal
    language: en
    word: GOAL
    hint: something you are working towards
    definition: >-
      The thing you are saving up for. Write it down, then colour in a little
      more every time you get closer to it.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-072, FIN-284)

  - id: hangman-stella-01-needs
    language: en
    word: NEEDS
    hint: things come in two kinds — these are the must-have kind
    definition: >-
      The things you must have to live and to go to school, like food, water, a
      home, clothes and your books. The things you would only enjoy are called
      wants.
    difficulty_band: warmup
    persona_bands: [stella]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-077)
