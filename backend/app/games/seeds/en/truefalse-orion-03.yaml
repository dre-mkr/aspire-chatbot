  - id: tfo-03-revenue-profit
    statement: >-
      Revenue is what a small business has left once its costs are paid.
    answer: false
    topic: Revenue and profit
    topic_line: " — money in is not money kept."
    takeaway: Revenue is everything that came in. Profit is what survives the costs.
    explanation: >-
      Revenue is the total coming in from sales before anything is taken out.
      Sell 100 bakes at EC$5 each and the revenue is EC$500 — and if the flour,
      oil, cooking gas and packaging cost EC$320, the profit is EC$180. That
      second figure is the one that tells you whether the business works. Costs
      arrive in two kinds and both have to be counted. Fixed costs stay the same
      whatever you sell, like a licence. Variable costs rise with every unit, like
      ingredients and packaging. Confusing the two is how a price gets set too
      low. The number worth working out is where the two meet: with EC$300 of
      fixed costs and EC$6 of profit per unit, you break even at 50 units, and
      everything sold after that is yours.
    paragraphs:
      - >-
        Revenue is the total coming in from sales before anything is taken out.
        Sell 100 bakes at EC$5 each and the revenue is EC$500 — and if the
        flour, oil, cooking gas and packaging cost EC$320, the profit is EC$180.
        That second figure is the one that tells you whether the business works.
      - >-
        Costs arrive in two kinds and both have to be counted. Fixed costs stay
        the same whatever you sell, like a licence. Variable costs rise with
        every unit, like ingredients and packaging. Confusing the two is how a
        price gets set too low.
      - >-
        The number worth working out is where the two meet: with EC$300 of fixed
        costs and EC$6 of profit per unit, you break even at 50 units, and
        everything sold after that is yours.
    difficulty_band: core
