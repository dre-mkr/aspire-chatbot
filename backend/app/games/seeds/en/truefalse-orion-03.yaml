# ASPIRE true or false — Orion set 3 (ages 13–18)
#
# A third Orion set, so a round of five is drawn from a wider bank and a reader
# who plays twice is unlikely to meet the same statement. Same register as sets
# 1 and 2: the mechanism first, one worked number where it earns its place, no
# cheerleading. Percentages, compounding and rates are allowed here and are not
# allowed in the Stella sets.
#
# Where sets 1 and 2 were authored from the design project, this one is written
# off the verified corpus: every programme, institutional or rate claim carries
# the knowledge base row it came from in `source_document`. General financial
# definitions carry no row because they need none.
#
# `explanation` is the flat authoritative text — the paragraphs joined. The
# `paragraphs` under it are the same words laid out for a client that can break
# them up. A client that ignores the layout still has the whole explanation.

id: truefalse-orion-03
game_type: true_false
language: en
title: True or false
source: ASPIRE knowledge base — student rows, cited per item

closing:
  lead: The number on the poster is not the number that decides it.
  text: >-
    Most money decisions are settled by a second figure sitting underneath the
    headline one: the total rather than the monthly amount, the rate after
    inflation rather than the rate advertised, what is left after costs rather
    than what came in. Working that second number out is nearly always simple
    arithmetic. Doing it before you sign is the whole skill.

entries:
  - id: tfo-03-rule-of-72
    statement: >-
      Dividing 72 by an interest rate gives a rough estimate of how many years
      money takes to double.
    answer: true
    topic: The rule of 72
    topic_line: " — a quick check on how hard your money is working."
    takeaway: 72 divided by the rate is roughly the years to double.
    explanation: >-
      It is an estimate rather than a formula to build a plan on, and it is close
      enough to do in your head. At 2 percent, 72 divided by 2 is about 36 years
      to double. At 6 percent it is about 12. What that arithmetic exposes is how
      much of the result belongs to the rate. Three or four extra points do not
      shave a few years off the wait; they cut it by two thirds, because the
      interest is being earned on a base that keeps growing. It works the other
      way too. If a scheme promises to double your money in a single year, the
      rule says it is quoting you something near 72 percent, and asking who is
      paying that is usually the end of the conversation.
    paragraphs:
      - >-
        It is an estimate rather than a formula to build a plan on, and it is
        close enough to do in your head. At 2 percent, 72 divided by 2 is about
        36 years to double. At 6 percent it is about 12.
      - >-
        What that arithmetic exposes is how much of the result belongs to the
        rate. Three or four extra points do not shave a few years off the wait;
        they cut it by two thirds, because the interest is being earned on a
        base that keeps growing.
      - >-
        It works the other way too. If a scheme promises to double your money in
        a single year, the rule says it is quoting you something near 72
        percent, and asking who is paying that is usually the end of the
        conversation.
    difficulty_band: advanced
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-127, FIN-124, FIN-131)

  - id: tfo-03-net-income
    statement: >-
      Budget percentages should be worked out on your pay before deductions are
      taken off.
    answer: false
    topic: Budgeting on net income
    topic_line: " — the plan has to sit on the money that actually arrives."
    takeaway: Budget on net income, the figure that reaches you, not the one you were quoted.
    explanation: >-
      A budget built on gross pay is a plan you cannot fund. Social Security and
      the other deductions come out before the money ever reaches you, so every
      band in the plan is quietly a little too big and the whole thing runs short
      in the last week of the month. Work from net income instead: the figure at
      the bottom of the payslip, the amount that lands in the account. If the
      categories do not balance against that number, they do not balance. It is a
      small correction, and it decides whether the plan survives contact with a
      real month. The band that gives way first when the arithmetic is wrong is
      almost always saving, because it is the one nobody chases you for.
    paragraphs:
      - >-
        A budget built on gross pay is a plan you cannot fund. Social Security
        and the other deductions come out before the money ever reaches you, so
        every band in the plan is quietly a little too big and the whole thing
        runs short in the last week of the month.
      - >-
        Work from net income instead: the figure at the bottom of the payslip,
        the amount that lands in the account. If the categories do not balance
        against that number, they do not balance.
      - >-
        It is a small correction, and it decides whether the plan survives
        contact with a real month. The band that gives way first when the
        arithmetic is wrong is almost always saving, because it is the one
        nobody chases you for.
    difficulty_band: core
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-353, FIN-080)

  - id: tfo-03-total-repayment
    statement: >-
      The monthly instalment is the number that tells you what a loan really
      costs.
    answer: false
    topic: The real cost of a loan
    topic_line: " — the total repaid is the price; the instalment is only the pace."
    takeaway: Instalment times number of payments, minus what you borrowed. That is the price.
    explanation: >-
      The instalment tells you whether you can carry the loan this month. It does
      not tell you the price. Multiply the instalment by the number of payments
      and subtract the amount you borrowed, and that difference is what the loan
      actually cost you. Stretching the term is where this bites. A longer term
      gives a smaller payment and a larger total, because interest is charged for
      more months, so the offer that feels most comfortable is often the most
      expensive one on the table. Ask for the APR as well. The annual percentage
      rate folds the fees in with the interest, which lets you compare two offers
      as one number instead of three, and any lender who will not put the total
      in writing has told you something.
    paragraphs:
      - >-
        The instalment tells you whether you can carry the loan this month. It
        does not tell you the price. Multiply the instalment by the number of
        payments and subtract the amount you borrowed, and that difference is
        what the loan actually cost you.
      - >-
        Stretching the term is where this bites. A longer term gives a smaller
        payment and a larger total, because interest is charged for more months,
        so the offer that feels most comfortable is often the most expensive one
        on the table.
      - >-
        Ask for the APR as well. It folds the fees in with the interest, which
        lets you compare two offers as one number instead of three, and any
        lender who will not put the total in writing has told you something.
    difficulty_band: advanced
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-174, FIN-173, FIN-176, FIN-365, FIN-191)

  - id: tfo-03-time-horizon
    statement: >-
      Money you know you will need within the next year should not be put at
      investment risk.
    answer: true
    topic: Risk and time
    topic_line: " — how soon you need it sets how much risk it can carry."
    takeaway: A short horizon caps your risk, whatever your appetite for it.
    explanation: >-
      Investment values move up and down, and a short horizon takes away your
      ability to wait out the down part. If you need the money in March, you sell
      at March's price, whatever March happens to be — and the loss becomes real
      at that moment rather than staying on paper. Money you will not touch for
      twenty years is a different case entirely. It can absorb the swings in
      exchange for higher expected growth, because it has the years to recover in.
      Same investment, different job, different answer. Read it from the other
      side as well: do not risk money you cannot afford to lose. School fees, rent
      and the emergency fund are not investment money, however convincing the
      opportunity sounds.
    paragraphs:
      - >-
        Investment values move up and down, and a short horizon takes away your
        ability to wait out the down part. If you need the money in March, you
        sell at March's price, whatever March happens to be.
      - >-
        Money you will not touch for twenty years is a different case entirely.
        It can absorb the swings in exchange for higher expected growth, because
        it has the years to recover in. Same investment, different job,
        different answer.
      - >-
        Read it from the other side as well: do not risk money you cannot afford
        to lose. School fees, rent and the emergency fund are not investment
        money, however convincing the opportunity sounds.
    difficulty_band: core
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-206, FIN-362, FIN-209, FIN-210)

  - id: tfo-03-real-return
    statement: >-
      A savings account can pay interest every year and still leave you able to
      buy less than you could before.
    answer: true
    topic: Real return
    topic_line: " — the rate that counts is the rate minus inflation."
    takeaway: Real return is your interest rate minus inflation, and it can be negative.
    explanation: >-
      The balance goes up while the buying power goes down, and both are true at
      once. Your real return is the interest rate minus inflation, so 2 percent
      earned against 3 percent inflation is a real return of minus 1 percent:
      richer on the statement, poorer at the counter. The Eastern Caribbean
      Central Bank sets a floor under what commercial banks may pay on savings,
      and it has been 2.0 percent since May 2015. A floor is worth having, because
      it stops the rate being nothing at all. It is not a promise to outpace
      prices, and it was never meant to be one. That gap is the honest argument
      for investing rather than only saving. Over long periods shares and bonds
      have historically grown faster than deposit rates, and the price of that is
      accepting the ups and downs along the way.
    paragraphs:
      - >-
        The balance goes up while the buying power goes down, and both are true
        at once. Your real return is the interest rate minus inflation, so 2
        percent earned against 3 percent inflation is a real return of minus 1
        percent: richer on the statement, poorer at the counter.
      - >-
        The Eastern Caribbean Central Bank sets a floor under what commercial
        banks may pay on savings, and it has been 2.0 percent since May 2015. A
        floor stops the rate being nothing at all. It is not a promise to
        outpace prices.
      - >-
        That gap is the honest argument for investing rather than only saving.
        Over long periods shares and bonds have historically grown faster than
        deposit rates, and the price of that is accepting the ups and downs
        along the way.
    difficulty_band: advanced
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-132, FIN-037, FIN-133, FIN-018)

  - id: tfo-03-credit-history
    statement: >-
      Holding balances with several different credit institutions is a good way
      to build a strong credit history.
    answer: false
    topic: Building credit
    topic_line: " — a record is built by paying on time, not by spreading debt around."
    takeaway: On-time payments and low balances build a record. Spreading balances does not.
    explanation: >-
      A credit report is a record of how you have handled borrowing, and lenders
      read it to decide whether to lend to you and at what rate. Several open
      balances do not read as strength on that record; they read as several
      obligations you are already carrying. What actually builds it is dull and
      slow. Pay every instalment on time, keep balances well below your limits,
      and avoid making a run of applications in a short period, because each one
      leaves a mark. Doing that consistently for years is the whole method, and
      repairing a damaged record uses exactly the same steps. A regional credit
      bureau system is being rolled out across the currency union under the Credit
      Reporting Act, which means the habits you build at 17 become the record
      somebody reads when you ask for your first serious loan.
    paragraphs:
      - >-
        A credit report is a record of how you have handled borrowing, and
        lenders read it to decide whether to lend to you and at what rate.
        Several open balances do not read as strength; they read as several
        obligations you are already carrying.
      - >-
        What actually builds it is dull and slow. Pay every instalment on time,
        keep balances well below your limits, and avoid making a run of
        applications in a short period. Doing that consistently for years is the
        whole method, and repairing a damaged record uses the same steps.
      - >-
        A regional credit bureau system is being rolled out across the currency
        union under the Credit Reporting Act, which means the habits you build
        at 17 become the record somebody reads when you ask for your first
        serious loan.
    difficulty_band: core
    persona_bands: [orion]
    volatility: stable
    source_document: ASPIRE knowledge base (FIN-363, FIN-185, FIN-183, FIN-364)

  - id: tfo-03-ecse-broker
    statement: >-
      Shares on the Eastern Caribbean Securities Exchange are bought through a
      licensed broker-dealer rather than by the buyer directly.
    answer: true
    topic: The ECSE
    topic_line: " — the exchange is reached through a broker, not walked into."
    takeaway: You place the order with a licensed broker-dealer; the exchange handles the rest.
    explanation: >-
      The ECSE is our regional stock exchange, launched in October 2001 and based
      at Bird Rock in Basseterre. It lists company shares, corporate bonds and
      government securities, and you cannot trade on it yourself: you open an
      account with a licensed broker-dealer and place your order through them. It
      is fully electronic, so there are no paper certificates to lose. Your
      holdings are recorded in the central depository, and a trade settles one
      business day after it is made, with the shares and the money changing hands
      together. Small amounts are not shut out either. Government securities on
      the regional market have generally started at EC$5,000, though a retail bond
      platform has offered entry from as little as EC$500.
    paragraphs:
      - >-
        The ECSE is our regional stock exchange, launched in October 2001 and
        based at Bird Rock in Basseterre. It lists company shares, corporate
        bonds and government securities, and you cannot trade on it yourself:
        you open an account with a licensed broker-dealer and place your order
        through them.
      - >-
        It is fully electronic, so there are no paper certificates to lose. Your
        holdings are recorded in the central depository, and a trade settles one
        business day after it is made, with the shares and the money changing
        hands together.
      - >-
