# THE KALEB SPLIT — a structural fact, recorded because it is the thing most
# often got wrong when reading this file.
# ---------------------------------------------------------------------------
kaleb_split:
  decision: Option B — kaleb is its own key with its own card file.
  is_not: A label on stella resolved by band.
  skye_card: stella.5-8.md
  kaleb_card: kaleb.9-12.md
  key_origin:
    stella: Inherited. Renaming it would be a migration, which is why the label is Skye and the key is not.
    kaleb: Created new, so it carries its own name.
  session_token: Skye issues stella. Kaleb issues kaleb — a distinct token.
  legacy_seam: The _SPLIT seam maps legacy stella/9-12 onto the new card.
  tethering: >-
    Skye is tethered to the stella file. Kaleb is not tethered to Skye — there
    is a new Kaleb file.

# ---------------------------------------------------------------------------
# BEFORE YOU PASTE
# ---------------------------------------------------------------------------
preflight:
  - Check the word ceiling against WORD_CAPS — 35 · 70 · 120 · 180 · none.
  - Check the ban list for that band. Read it again; do not rely on memory.
  - No card spells a persona name. {name} everywhere. Stella, Orion, Aurora, Nova, Skai, Dion, Prosper, Destiny, Star and Sky all fail the build.
  - The CARE block is identical in all seven, Ministry route included.
  - Run pytest tests/test_local_context.py — 82 tests, and it is the thing that catches a retired name or a banned word before a reader does.
