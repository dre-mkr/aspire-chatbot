# Module 1 -- Saving
#
# The first module of the ASPIRE course, authored for every band.
#
# Two rules govern the content below and both are checked at load time:
#
#   * Every example is LOCAL and CONCRETE. Patties, snow cones, school
#     supplies, a bicycle, a Carnival costume, a Christmas gift. Never an
#     abstract percentage below 13, and never a scenario a child here has not
#     seen.
#
#   * Every band's text uses only words that band's vocabulary ladder allows.
#     The 5-8 text never says "interest"; the 9-12 text never says "compound".
#     `Concept._vocabulary_is_permitted_at_band_min` fails the load if it does.
#
# The 16-18 and adult bands inherit 13-15's text where they have none of their
# own -- see `for_band`. That is downward inheritance, deliberately: giving an
# older reader younger wording is at worst plain, while the reverse would put
# words in front of a child that the safety layer would then have to strip.

id: module_01_saving
title: Saving
order: 1
band_min: "5-8"
band_max: adult

concepts:
  - id: save
    name: Saving
    band_min: "5-8"
    vocabulary: [save, money, coin, wait, goal]

  - id: spend
    name: Spending
    band_min: "5-8"
    vocabulary: [spend, money, coin]

  - id: goal
    name: A saving goal
    band_min: "5-8"
    prerequisites: [save]
    vocabulary: [goal, save, wait, money]

  # `scarcity` BELONGS HERE AND IS DELIBERATELY NOT HERE YET.
  #
  # The pedagogy is not in dispute: the client's own material for the youngest
  # band teaches scarcity FIRST, before needs and wants, because it is the *why*
  # behind "needs come first". Without it that is a rule to memorise; with it, a
  # conclusion a child reaches. We even have the video -- `captain-careful
  # -scarcity` is Lesson 1 of that same material.
  #
  # What cannot ship is the node WITHOUT the lesson. Mastery is evidence and
  # evidence comes from a lesson's check questions, so a concept nothing teaches
  # can never be mastered -- and if `need` depends on it, `need` never opens, and
  # `budget` depends on `need`. Two of the five lessons, closed to every learner
  # in every band, with nothing raising a word.
  #
  # Add it back WITH its lesson at order 1, authored from that material rather
  # than invented, and repoint `need` to [scarcity, spend] in the same commit.

  - id: need
    name: Needs and wants
    band_min: "5-8"
    prerequisites: [spend]
    vocabulary: [need, want, spend, money]

  - id: budget
    name: Making a plan for your money
    band_min: "5-8"
    prerequisites: [need, goal]
    vocabulary: [budget, save, spend, need, want, goal]
  - id: habit
    name: Money habits
    band_min: "5-8"
    prerequisites: [save]
    vocabulary: [habit, save, money, keep]

lessons:
  # ── 1. What saving is ────────────────────────────────────────────────────
  - id: l01_what_is_saving
    module_id: module_01_saving
    concept_id: save
    order: 1
    objective: The learner can say, in their own words, that saving is keeping money instead of using it now.
    # ── the six voices ───────────────────────────────────────────────────
    # Persona KEYS, never labels. Consulted BEFORE `teach_points`, which stays
    # as the band fallback for any persona with no voice authored here. Imani,
    # Azuri and Guest are all `adult`; they differ by VOICE, not reading level.
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "Saving means you keep your money instead of using it today."
          - "The money does not go away. It waits for you in your tin."
          - "Every coin you keep makes your pile bigger."
        examples:
          - "Grandma gives you two dollars. One snow cone now, one dollar kept in the tin."
        joke: "My tin never spends a cent. Best saver I know."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "Saving is keeping money now so you have more later -- nothing is lost, it is just not spent yet."
          - "Small amounts kept often beat big amounts kept never."
          - "The money is still yours. Saving is a when, not a goodbye."
        examples:
          - "EC$5 for helping at the shop: EC$2 on patties, EC$3 into the account. You still ate."
        joke: "Money in the tin cannot buy patties. That is the whole point."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "Saving is deferring a purchase, not cancelling one."
          - "What you keep stays yours and stays reachable -- saving is not locking it away."
          - "Regular small amounts win, because those are the ones you actually keep doing."
        examples:
          - "EC$80 from a Saturday job: keep EC$30, and EC$50 is still yours to enjoy."
        joke: "Saving once is an event. Saving weekly is a habit. Only one of them works."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "Saving is a habit you show more than one you explain -- let them see you keep some first."
          - "The tin they can see beats the account they cannot. Start with what is visible."
          - "Name what they already do right and build onto it. Most children already hoard something."
        examples:
          - "Three coins from Granny, and your child keeps one before the shop is even mentioned."
        joke: "The tin on the shelf teaches more than any lecture from the sofa."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The objective is that a learner can SAY saving is keeping money instead of using it now -- in their own words, not yours."
          - "Make the habit concrete: a set-aside they perform, not a definition they recite."
          - "Mark the reasoning, not the wording. 'It is still mine, just later' is mastery."
        examples:
          - "Play EC$ and a tin: each learner keeps some before the class shop opens, then says why."
        joke: "Ask them to define saving and you get the textbook. Ask what they kept and you get the lesson."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "You already know you should save -- the gap is the habit, not the idea."
          - "Beat willpower with a system: move the keeping out on payday, before it is in your hand to spend."
          - "Small and automatic beats large and hoped-for. A standing transfer never forgets."
        examples:
          - "On payday, EC$100 moves to savings before the week starts spending it for you."
        joke: "The money you never see is the money you never miss."
    teach_points:
      "adult":
        - "Saving is moving money from now to later -- it stays yours and stays reachable."
        - "The adult gap is behaviour, not knowledge: build the habit, do not relearn the fact."
        - "Keep first, on payday, by standing order -- a system beats willpower every month."
      "5-8":
        - "Saving means you keep your money instead of using it today."
        - "The money does not go away. It waits for you."
        - "Every coin you keep makes your pile bigger."
      "9-12":
        - "Saving is choosing to keep money now so you have more of it later."
        - "Nothing is lost when you save -- the money is still yours, just not spent yet."
        - "Small amounts kept often add up faster than most people expect."
      "13-15":
        - "Saving is deferring a purchase, not cancelling one."
        - "The money you keep stays yours and stays available; what changes is when you use it."
        - "Regular small amounts beat occasional large ones, because you actually keep doing them."
      "16-18":
        - "Saving is the decision to move money from now to later."
        - "Consistency matters more than size: EC$10 every week is a habit, EC$500 once is an event."
        - "Money kept in an account is money you can still reach -- saving is not the same as locking it away."
    examples:
      "5-8":
        - "Grandma gives you two dollars. You buy one snow cone and keep the other dollar in your tin."
        - "You want a football. Every week you put one coin in the tin until there are enough."
      "9-12":
        - "You get EC$5 for helping at the shop. You spend EC$2 on patties and keep EC$3 in your ASPIRE account."
        - "A bicycle costs EC$300. Keeping EC$10 every week gets you there before Christmas next year."
      "13-15":
        - "A Carnival costume costs EC$450. Setting aside EC$25 a week from January means you are not scrambling in July."
        - "You earn EC$80 on a Saturday job. Keeping EC$30 of it still leaves EC$50 to enjoy."
      "16-18":
        - "Your first pay packet is EC$900. Moving EC$150 to savings on payday means you never see it as spendable."
        - "School supplies for the term cost about EC$400. Saved over eight months, that is EC$50 a month rather than one painful week."
    suggested_widget_kind: compare
    check_questions:
      - id: q1_keep_or_use
        prompt:
          "5-8": "You keep a coin in your tin instead of buying sweets. What is that called?"
          "9-12": "You put EC$3 away instead of spending it. What is that called?"
          "13-15": "You move EC$25 into your account instead of spending it this week. What is that?"
          "16-18": "On payday you move EC$150 to savings before you spend anything. What is that?"
        options: [Saving, Spending]
        answer: 0
        hints:
          "5-8":
            - "Ooh, so close! Think about where the coin goes -- into your tin, or into the shop?"
            - "It is one of these two. Which one keeps the coin?"
            - "It is saving! You kept the coin instead of using it. That is what saving means."
          "9-12":
            - "Nearly! Think about whether the money left you or stayed with you."
            - "It is one of these two. Which one means the money is still yours?"
            - "It is saving! The money stayed with you for later. That is saving."
          "13-15":
            - "Close. Ask yourself whether the money left your account or moved within it."
            - "It is one of these two. Which one still has the money in your name?"
            - "It is saving -- the money moved from now to later, and it is still yours."
          "16-18":
            - "Did the money leave you, or just move within what is yours?"
            - "One of these two. Which one still has the money in your name?"
            - "Saving -- moved from now to later, still yours, and done on payday so willpower never enters into it."

      - id: q2_explain_back
        prompt:
          "5-8": "Can you tell Skye what saving means, in your own words?"
          "9-12": "In your own words -- what does saving mean?"
          "13-15": "Say it back to me in your own words: what is saving?"
          "16-18": "In your own words -- what is saving, and what makes the habit actually stick?"
        graded: false
        accept: [keep, keeping, later, save, not spend, put away, tin, account, wait]

    guide:
      educator:
        "5-8":
          timing_minutes: 30
          materials: ["A tin or jar", "Play coins"]
          misconceptions:
            - wrong: "They think saved money is gone, like spent money."
              say: "Open the tin. Count it. Still yours, and still here."
            - wrong: "They think saving means never getting the thing."
              say: "Saving is HOW you get the thing. The tin is the road to the football."
          extension: "Each child names one thing they would keep a coin for this week."
        "9-12":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They treat saving as an event -- one big amount, once."
              say: "Which wins by Christmas: EC$10 every week, or EC$100 one time in June?"
            - wrong: "They think small amounts are not worth keeping."
              say: "Run EC$3 a week to the end of term on the board. Let the total argue."
          extension: "Track a real week of pocket money: kept, spent, and what the kept part is for."
        "13-15":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They equate saving with not being allowed to spend."
              say: "Saving is deferring, not cancelling. The money is still theirs -- ask them when, not whether."
            - wrong: "They think saving only counts when there is a lot to save."
              say: "EC$25 a week from a Saturday job is EC$1,300 a year. Do the multiplication together."
          extension: "Price something real they want, and work backwards to a weekly amount."
      guardian:
        "5-8":
          doing: "Learning that kept money is not lost money -- it waits."
          do_together: "Keep one coin together at the shop, and count the tin at home."
          ask_them: "Where is your coin now? Is it still yours?"
          got_it_sounds_like: "They say the money is waiting, not gone."
        "9-12":
          doing: "Learning that small amounts kept often beat big amounts kept never."
          do_together: "Pick a goal, put the week's kept money somewhere they can see."
          ask_them: "How many weeks to the goal at this rate?"
          got_it_sounds_like: "They do the division themselves and tell you the date."
        "13-15":
          doing: "Learning that saving is a timing choice, not a punishment."
          do_together: "Talk through one real purchase they deferred, and what changed."
          ask_them: "What did waiting cost you? What did it get you?"
          got_it_sounds_like: "They weigh both sides without being prompted."

  # ── 2. Spending is not the enemy ────────────────────────────────────────
  - id: l02_spending_is_fine
    module_id: module_01_saving
    concept_id: spend
    order: 2
    objective: The learner understands that spending is normal and that saving is a choice about timing, not a rule about never buying.
    # ── the six voices ───────────────────────────────────────────────────
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "Spending is using your money to get something."
          - "Spending is not naughty. Everybody spends."
          - "Keep some too, so you can get bigger things later."
        examples:
          - "You buy a snow cone with one dollar. That is spending, and it is fine!"
        joke: "I spent a whole dollar on joy. Worth it."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "Spending is what money is for -- it turns money into things you need and enjoy."
          - "Saving everything and enjoying nothing is not a plan anybody keeps."
          - "The question is not whether to spend, but how much to keep first."
        examples:
          - "EC$5 on patties at break is spending. EC$5 into the account Friday is saving. Most weeks you do both."
        joke: "A tin with no snacks nearby is just a sad tin."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "Money has one job: to be exchanged for something you want or need."
          - "A plan you resent is a plan you abandon by March -- build the enjoyable spending in."
          - "Keep first, spend the rest. The order does the work, not the amount."
        examples:
          - "EC$200 in December: EC$120 saved, EC$80 for gifts, is a plan you will actually keep."
        joke: "Nobody ever kept a rule that banned snow cones until 2028."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "Let them spend some of their own money and feel it -- the felt trade-off teaches faster than the ban."
          - "Do not label a child's want as bad; label the timing. 'Not this week' beats 'no'."
          - "The habit to model is keep-first, then spend freely -- guilt-free is the goal."
        examples:
          - "Your child spends part of their pocket money and keeps part, and you praise the keeping."
        joke: "Ban the treat and you teach sneaking. Time the treat and you teach planning."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The misconception to correct is that saving means never spending -- it is timing, not abstinence."
          - "Have them defend a spend, not just a save. A justified purchase is evidence of the concept."
          - "Watch for the learner who calls all spending failure; that is the error, not the spending."
        examples:
          - "Pairs get a play wage, must both save AND spend, then defend one spend to the class."
        joke: "The learner who saves everything has missed the point as surely as the one who saves nothing."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "Spending is not the enemy -- unplanned spending is. Decide first, do not deprive yourself."
          - "A budget with no room for enjoyment is one you will break; build the treat in on purpose."
          - "Keep first on payday, then spend the rest without guilt -- the order is the whole trick."
        examples:
          - "Set the keeping aside on payday, and spend the rest of the month without doing sums in the shop."
        joke: "A budget with no fun in it lasts about as long as a New Year gym plan."
    teach_points:
      "adult":
        - "Spending is normal; unplanned spending is the problem. Decide the split first, then spend the rest freely."
        - "A plan with no enjoyment built in is one you abandon -- guilt-free spending is part of the method."
        - "Keep-first on payday makes the rest genuinely spendable. The order does the work."
      "5-8":
        - "Spending is using your money to get something."
        - "Spending is not naughty. Everybody spends."
        - "The trick is to keep some too, so you can get bigger things later."
      "9-12":
        - "Spending is what money is for -- it is how you turn money into things you need and enjoy."
        - "Saving everything and enjoying nothing is not a plan anybody keeps to."
        - "The useful question is not whether to spend, but how much to keep first."
      "13-15":
        - "Money has one job: to be exchanged for something you want or need."
        - "A plan you resent is a plan you abandon by March, so build the enjoyable spending in."
        - "Keep first, spend the rest. The order is what makes it work, not the amount."
      "16-18":
        - "Money's job is to be exchanged -- for now or for later. Saving is a choice about when, not whether."
        - "Build the enjoyable spending into the plan on purpose; a plan you resent is one you drop."
        - "Keep first, then spend the rest without second-guessing every purchase."
    examples:
      "5-8":
        - "You buy a snow cone with one dollar. That is spending, and it is fine!"
        - "You keep one dollar and spend one dollar. Now you have a treat AND a growing tin."
      "9-12":
        - "EC$5 on patties at break is spending. EC$5 into the account on Friday is saving. Most weeks you do both."
        - "Buying a Christmas gift for your mother is spending -- and it is exactly what you saved for."
      "13-15":
        - "You earn EC$200 in December helping at a shop. EC$120 saved, EC$80 for Christmas gifts is a plan you will actually keep."
        - "Nobody sticks to a rule that says no snow cones until 2028."
      "16-18":
        - "First pay packet: move the keeping on payday, and the rest is yours to spend without sums at the till."
        - "December pays more than February -- keep the same share, and enjoy the rest guilt-free."
    suggested_widget_kind: allocator
    check_questions:
      - id: q1_spending_ok
        prompt:
          "5-8": "Is it bad to spend some of your money?"
          "9-12": "Is spending some of your money a problem?"
          "13-15": "Does spending part of your money break a savings plan?"
          "16-18": "You keep part of your pay first, then spend the rest. Does spending the rest break your savings?"
        options: ["No -- it is fine", "Yes -- always"]
        answer: 0
        hints:
          "5-8":
            - "Think about the snow cone. Was that a bad thing?"
            - "It is one of these two. Did we say spending was naughty?"
            - "It is fine to spend! We said everybody spends. The trick is to keep some too."
          "9-12":
            - "Think about a plan you could actually stick to for a whole year."
            - "It is one of these two. Which one describes a plan somebody keeps?"
            - "Spending is fine. What matters is keeping some first."
          "13-15":
            - "Think about which plan survives contact with December."
            - "One of these two. Which describes a plan you would still be following in March?"
            - "It is fine. A plan with no enjoyment in it is a plan you abandon."
          "16-18":
            - "Think about whether the keeping already happened before the spending."
            - "One of these two. Which plan is one you would still keep in March?"
            - "It is fine. If you kept first, the rest is yours to spend -- the order is the method."

    guide:
      educator:
        "5-8":
          timing_minutes: 25
          materials: ["Play coins", "Two picture cards: a treat, a tin"]
          misconceptions:
            - wrong: "They hear that spending is bad and hide what they bought."
              say: "We bought the snow cone and it was fine. What did we also keep?"
          extension: "Everyone names one good spend from this week, and claps for it."
        "9-12":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They swing to all-saving and call classmates wasteful."
              say: "A plan with no patties in it gets abandoned by March. Build the treat in."
          extension: "Design a week that includes BOTH: something kept, something enjoyed."
        "13-15":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They frame every purchase as a failure of discipline."
              say: "Keep first, then spend the rest without guilt. Interrogate the ORDER, not the treat."
          extension: "Take a real month and mark which spends were planned. Only the unplanned ones get discussed."
      guardian:
        "5-8":
          doing: "Learning that spending is normal and keeping some is the trick."
          do_together: "Buy the treat AND feed the tin, same day, and name both out loud."
          ask_them: "What did we enjoy today? What did we keep?"
          got_it_sounds_like: "They stop hiding what they spent."
        "9-12":
          doing: "Learning that the question is how much to keep first, not whether to spend."
          do_together: "Split the week's money together before any of it is spent."
          ask_them: "What is the keep-first amount this week?"
          got_it_sounds_like: "They name the split before you ask."
        "13-15":
          doing: "Learning that a plan with enjoyment in it is the one that survives."
          do_together: "Let them defend one fun purchase inside their plan -- and accept the defence."
          ask_them: "Was it in the plan? Then it is fine. What is next week's plan?"
          got_it_sounds_like: "They talk about the order of money, not the guilt of it."

  # ── 3. A goal makes saving easier ───────────────────────────────────────
  - id: l03_a_goal
    module_id: module_01_saving
    concept_id: goal
    order: 3
    objective: The learner can name a saving goal and work out roughly how long it takes to reach it.
    # ── the six voices ───────────────────────────────────────────────────
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "A goal is the thing you are saving for."
          - "When you can picture it, waiting is much easier."
          - "Every coin gets you closer to it."
        examples:
          - "Your goal is a football. It costs ten coins. You have four. Six more to go!"
        joke: "My goal is a bigger tin. For all the coins."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "A goal turns saving from a rule into a plan with an ending."
          - "Write down what it is and what it costs -- a goal you have not priced is a wish."
          - "Then work out how much to keep each week to get there."
        examples:
          - "A bicycle costs EC$300. EC$10 a week is 30 weeks -- about seven months."
        joke: "A wish is a goal that never got a price tag."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "A goal gives your saving a deadline, and the deadline makes the weekly amount obvious."
          - "Price it, date it, divide it. That is the whole method."
          - "A goal you cannot reach in the time discourages -- adjust the goal or the time."
        examples:
          - "A Carnival costume is EC$450 and Carnival is 26 weeks away. About EC$18 a week."
        joke: "Price it, date it, divide it. Three steps, no magic."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "Let the goal be theirs, not yours -- a child saves hardest for the thing they chose."
          - "Make it visible: a picture on the tin, a bar they colour in. Progress they can see, they keep."
          - "Help them price and date it once; the arithmetic is the lesson, not the toy."
        examples:
          - "Your child names the goal and prices it, and you help only with the sum, not the choosing."
        joke: "A goal you chose for them is one they save for at your pace, not theirs."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The objective is name a goal AND estimate the time -- the estimate is where the numeracy lives."
          - "Have them price, date and divide; mark the method, not whether the toy is sensible."
          - "A mis-scoped goal is a teaching moment: adjust the amount or the deadline, out loud."
        examples:
          - "Each learner prices a real goal, sets a date, works out the weekly keep; compare methods."
        joke: "Mark the dividing, not the dream. The dream is theirs; the arithmetic is ours."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "A goal turns 'I should save' into a number and a date -- vague saving rarely sticks."
          - "Price it, date it, divide it, then automate that amount so the goal saves itself."
          - "One named goal beats a general intention. The brain keeps a promise it can picture."
        examples:
          - "A EC$2400 course, twelve months out: EC$200 a month, set to move on payday."
        joke: "Saving 'in general' is how you reach December with only good intentions."
    teach_points:
      "adult":
        - "A goal turns 'I should save' into a number and a date -- price it, date it, divide it."
        - "Automate the weekly or monthly amount so the goal saves itself, rather than relying on memory."
        - "One named, pictured goal keeps better than a general intention to save."
      "5-8":
        - "A goal is the thing you are saving for."
        - "When you can picture it, waiting is much easier."
        - "Every coin gets you closer to it."
      "9-12":
        - "A goal turns saving from a rule into a plan with an ending."
        - "Write down what it is and what it costs -- a goal you have not priced is a wish."
        - "Then work out how much to keep each week to get there."
      "13-15":
        - "A goal gives your saving a deadline, and a deadline is what makes the weekly amount obvious."
        - "Price it, date it, divide it. That is the whole method."
        - "A goal you cannot reach in the time you have is not motivating -- it is discouraging. Adjust one or the other."
      "16-18":
        - "A goal gives saving a deadline, and the deadline makes the amount per pay obvious."
        - "Price it, date it, divide it -- then move that amount automatically so it does not depend on willpower."
        - "If the goal will not fit the time, change the goal or the date; do not just hope."
    examples:
      "5-8":
        - "Your goal is a football. It costs ten coins. You have four. Six more to go!"
        - "Your goal is a gift for your brother at Christmas."
      "9-12":
        - "A bicycle costs EC$300. If you keep EC$10 a week, that is 30 weeks -- about seven months."
        - "New boots for school cost EC$80. EC$5 a week gets you there in 16 weeks."
      "13-15":
        - "A Carnival costume is EC$450 and Carnival is 26 weeks away. That is about EC$18 a week."
        - "A phone costs EC$600. Twelve months of EC$50 gets there; six months of EC$50 does not."
      "16-18":
        - "A phone costs EC$900 and you want it in 6 months: EC$150 a month, moved on payday."
        - "CFBC fees land in September; counted back from now, that is a fixed amount each pay."
    suggested_widget_kind: timeline
    check_questions:
      - id: q1_weeks_to_goal
        prompt:
          "5-8": "Your goal costs ten coins. You put in one coin every week. How many weeks?"
          "9-12": "A goal costs EC$100 and you keep EC$10 a week. How many weeks?"
          # WAS EC$450 at EC$25, whose answer is 18 -- and the key said "Ten".
          # The third hint rung admitted it in the same breath: "EC$450 at EC$25
          # a week is eighteen, so ten is the closest of these." The lesson
          # taught a fourteen-year-old to divide, then marked the division wrong.
          # Joseph Lin checks arithmetic; so does a judge with a rubric.
          # EC$250 at EC$25 is exactly ten, which is what the options already say.
          "13-15": "A goal costs EC$250 and you keep EC$25 a week. How many weeks?"
          "16-18": "A goal costs EC$2500 and you keep EC$250 each month. How many months?"
        options: ["Ten", "Two", "One hundred"]
        answer: 0
        hints:
          "5-8":
            - "So close! Count how many coins you need, and how many you put in each week."
            - "It is one of these two: ten, or two?"
            - "It is ten! Ten coins, one each week, is ten weeks. Well counted."
          "9-12":
            - "Nearly. How many EC$10 fit into EC$100?"
            - "It is one of these two: ten, or two?"
            - "It is ten. EC$100 divided by EC$10 a week is ten weeks."
          "13-15":
            - "Close. Divide the goal by what you keep each week."
            # Rung 2 named options 0 and 2 while `narrow_options` renders 0 and 1,
            # so the reader was told to choose between two things and shown a
            # different two.
            - "It is one of these two: ten, or two?"
            - "It is ten. EC$250 divided by EC$25 a week is ten weeks exactly."
          "16-18":
            - "Divide the goal by what you keep each period."
            - "It is one of these two: ten, or two?"
            - "Ten. EC$2500 divided by EC$250 a month is ten months exactly."

      - id: q2_name_a_goal
        prompt:
          "5-8": "What would YOU save for? Tell Skye."
          "9-12": "What is one thing you would save for?"
          "13-15": "Name a goal of your own, and roughly what it costs."
          "16-18": "Name a goal of your own, roughly what it costs, and when you want it by."
        graded: false
        accept: [bike, bicycle, phone, shoes, boots, gift, costume, game, ball, book, school]

    guide:
      educator:
        "5-8":
          timing_minutes: 30
          materials: ["Picture cards of goals", "A paper thermometer to colour"]
          misconceptions:
            - wrong: "They pick a goal so big it cannot be reached this term."
              say: "Pick something ten coins big. Reaching it is the lesson; the bicycle can be next."
          extension: "Colour one segment of the goal chart for every coin kept."
        "9-12":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They name the goal but never price it."
              say: "A goal without a price is a wish. What does it cost, to the dollar?"
          extension: "Price it, date it, divide it -- on paper, for a real goal of theirs."
        "13-15":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They set a weekly amount they cannot actually keep."
              say: "Adjust the goal or the date. A plan that fails week one teaches the wrong lesson."
          extension: "Two versions of the same goal: aggressive and comfortable. Argue for one."
      guardian:
        "5-8":
          doing: "Learning that a goal makes waiting easier."
          do_together: "Draw the goal and stick it on the tin."
          ask_them: "How many more coins to the football?"
          got_it_sounds_like: "They count down without being asked."
        "9-12":
          doing: "Learning to price a goal and work out the weeks."
          do_together: "Check the real price together -- in the shop or online."
          ask_them: "At EC$5 a week, when do you get there?"
          got_it_sounds_like: "They answer with a date."
        "13-15":
          doing: "Learning to fit a goal to the money they actually have."
          do_together: "Review the weekly amount after two weeks and let them adjust it."
          ask_them: "Is the amount right, or does the date move?"
          got_it_sounds_like: "They adjust the plan instead of abandoning it."

  # ── 4. Needs and wants ──────────────────────────────────────────────────
  - id: l04_needs_and_wants
    module_id: module_01_saving
    concept_id: need
    order: 4
    objective: The learner can sort ordinary purchases into needs and wants, and sees that the line is a judgement rather than a rule.
    # ── the six voices ───────────────────────────────────────────────────
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "A need is something you must have to live. A want is something you would like."
          - "Wanting things is fine. But needs come first."
          - "Food and water are needs. Toys are wants."
        examples:
          - "Water is a need. A snow cone is a want."
        joke: "My biggest need is snacks. ...Okay, that one is a want."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "A need is something you have to have; a want is something you would like."
          - "Needs come first when money is short -- that is the only rule."
          - "Lots of things sit in between, and reasonable people disagree about them."
        examples:
          - "School shoes are a need. A third pair in your favourite colour is a want."
        joke: "Patties every single day: technically a want. Emotionally, a need."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "Needs are non-negotiable: food, fees, transport to get there."
          - "Wants are everything else, and wanting things is not a character flaw."
          - "The line moves with circumstances -- shoes are a need, a brand of shoes is a want."
        examples:
          - "Data for schoolwork is a need. Data for six hours of video is a want."
        joke: "The line between need and want moves the moment you are the one paying."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "Sort with them, do not sort for them -- the judging is the skill you are handing over."
          - "Use real household examples: the light bill, the bus fare, the treat. Abstract lists do not stick."
          - "Let the in-between cases stay arguable; 'it depends, and here is what moves it' is the right answer."
        examples:
          - "At the shop, hold up two things and ask which one you could not go home without."
        joke: "Ask a child to sort needs and wants and you learn what they think you can afford."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The objective is that the line is a JUDGEMENT, not a fixed rule -- the in-between cases are the lesson."
          - "Mark the reasoning: 'a need for us, a want for them' shows they understand context."
          - "Watch for sorting turning moral; wanting is not a fault, and that correction is part of the teaching."
        examples:
          - "Learners sort a week of real spending and count the in-betweens; defend the borderline ones."
        joke: "The moment the sorting turns into judging, the concept has been missed -- gently reset it."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "The needs list gets longer and quieter with age -- transport, phone-for-work, your share at home."
          - "An unplanned need breaks a month; a planned want does not. Guard against the surprise need."
          - "Sort your own spending honestly once, on paper. Most people find something on the wrong side."
        examples:
          - "Your share of the light bill is a need -- and the one people most often leave out of the plan."
        joke: "The light bill is a need that waits quietly until the exact worst moment."
    teach_points:
      "adult":
        - "The needs list gets longer and quieter with age -- transport, phone-for-work, your share at home."
        - "An unplanned need is what breaks a month; a planned want is not a failure of discipline."
        - "Sort your own spending honestly once, on paper -- most people find one thing on the wrong side."
      "5-8":
        - "A need is something you must have to live. Food. Water. Clothes. A home."
        - "A want is something you would like. A toy. A treat."
        - "Wanting things is fine. But needs come first."
      "9-12":
        - "A need is something you have to have. A want is something you would like."
        - "Needs come first when the money is short -- that is the only rule here."
        - "Plenty of things sit in between, and reasonable people put them on different sides."
      "13-15":
        - "Needs are non-negotiable: food, school fees, transport to get there."
        - "Wants are everything else, and wanting things is not a character flaw."
        - "The line moves with circumstances. Shoes are a need; a particular brand of shoes is a want."
      "16-18":
        - "Once you are earning, the needs list gets longer and quieter: transport, phone credit for work, your share at home."
        - "A want you have planned for is not a failure of discipline. An unplanned need is what actually breaks a month."
        - "Sort your own spending honestly once, on paper. Most people find one thing they had filed on the wrong side."
    examples:
      "5-8":
        - "Water is a need. A snow cone is a want."
        - "School shoes are a need. A toy is a want."
        - "When there is not enough for everybody, we share, and needs go first."
      "9-12":
        - "School shoes are a need. A third pair in your favourite colour is a want."
        - "Lunch is a need. Patties every single day is a want."
        - "A bus fare to school is a need. A taxi because you left late is somewhere in between."
      "13-15":
        - "A school bag is a need. The one everyone has this year is a want."
        - "Data for your schoolwork is a need. Data for six hours of video is a want."
        - "A Carnival costume is a want -- and a want you have saved for is a perfectly good reason to spend."
      "16-18":
        - "Bus fare to a job interview is a need. The shoes you would prefer to wear to it are a want."
        - "Your share of the light bill at home is a need, and it is the one people forget to plan for."
        - "CFBC registration is a need in September. It stops being negotiable the week before."
    suggested_widget_kind: sort_buckets
    check_questions:
      - id: q1_sort
        prompt:
          "5-8": "Food to eat -- need or want?"
          "9-12": "Lunch at school -- need or want?"
          "13-15": "Transport to get to school -- need or want?"
          "16-18": "Your share of the light bill at home -- need or want?"
        options: [Need, Want]
        answer: 0
        hints:
          "5-8":
            - "Could you live without it?"
            - "One of these two. What happens if you have none?"
            - "It is a need. You must eat every day."
          "9-12":
            - "Think about what happens to your day if you do not have it."
            - "One of these two. Could you get through the school day without it?"
            - "It is a need. You have to eat, so lunch comes before the extras."
          "13-15":
            - "Ask what stops happening without it."
            - "One of these two. Which one means you cannot attend?"
            - "It is a need -- without it you do not get to school at all."
          "16-18":
            - "Ask who else it affects, not just you."
            - "One of these two. What happens in the house if nobody pays it?"
            - "It is a need. A shared bill is still a bill, and it is the one most often left out of a plan."

      - id: q2_the_line_moves
        prompt:
          "5-8": "Tell Skye one need and one want of your own."
          "9-12": "Name one thing that could be a need OR a want, depending."
          "13-15": "Give me something that sits in between, and say what would push it either way."
          "16-18": "Name one thing you have filed on the wrong side, and say why."
        graded: false
        accept: [shoes, phone, data, bag, food, transport, bus, uniform, lunch, depends, sometimes, because]

    guide:
      educator:
        "5-8":
          timing_minutes: 35
          materials: ["Two labelled buckets or hoops", "Ten picture cards of everyday items"]
          misconceptions:
            - wrong: "They sort by what costs more, so an expensive toy becomes a need."
              say: "A dear want is still a want. Could you live without it?"
            - wrong: "They call everything a need, because they want all of it."
              say: "Show me what happens if it disappears. Do you stop, or do you carry on?"
          extension: "Ask them to find one need and one want in their own school bag."
        "9-12":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They treat the line as fixed and argue about the in-between ones."
              say: "You are both right. Say what would move it."
            - wrong: "They assume a need must be boring."
              say: "Nothing about a need says it cannot be enjoyable. Try again."
          extension: "Give them the taxi example and ask them to argue both sides."
        "13-15":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They judge each other's wants, and the sorting turns moral."
              say: "We are sorting, not judging. Wanting things is not a fault."
            - wrong: "They forget that circumstances move the line."
              say: "Same item, different household. Does the answer change?"
          extension: "Ask them to sort one week of their own spending and count the in-betweens."
      guardian:
        "5-8":
          doing: "Telling apart what we must have and what we would like."
          do_together: "At the shop, hold up two things and ask which one we could not go home without."
          ask_them: "Which one is a need? How do you know?"
          got_it_sounds_like: "They give a reason, not just a word. Food, because we have to eat."
        "9-12":
          doing: "Sorting ordinary spending into needs and wants, including the ones in between."
          do_together: "On the way home, ask which two things in the bag were needs and which were not."
          ask_them: "Was the bus fare a need today, or could we have walked?"
          got_it_sounds_like: "They notice something sits in between, and can say what would move it."
        "13-15":
          doing: "Working out that the needs-and-wants line moves with circumstances."
          do_together: "Ask them to name one thing that is a need for us and a want for somebody else."
          ask_them: "What would have to change for that to move sides?"
          got_it_sounds_like: "They argue it both ways without deciding somebody is wrong."

  # ── 5. A simple plan ────────────────────────────────────────────────────
  - id: l05_a_simple_plan
    module_id: module_01_saving
    concept_id: budget
    order: 5
    objective: The learner can split an amount of money into keeping, spending and sharing, and explain their split.
    # ── the six voices ───────────────────────────────────────────────────
    # Persona KEYS, never labels. Consulted BEFORE `teach_points`, which stays
    # as the band fallback for any persona with no voice authored here.
    #
    # Imani, Azuri and Guest are all `adult`. They differ by VOICE, not by
    # reading level -- which is what the band map could not express, and why
    # every adult fell through to the 13-15 words.
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "A plan says where your money goes before you get it."
          - "Keep some. Spend some. Share some."
          - "Money can run out, so the things you really need come first."
        examples:
          - "Three tins on the table: one to keep, one to spend, one to share."
        joke: "My plan has three tins. The keeping tin is the quiet one."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "A plan tells each part of your money where to go before it arrives."
          - "An easy split: keep some, spend some, share some."
          - "There is no single right split, but deciding early beats deciding at the shop."
        examples:
          - "EC$10 pocket money: EC$4 kept, EC$4 spent, EC$2 shared. Decide it on Monday."
        joke: "Deciding at the shop is deciding on hard mode."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "Decide the split on payday, not at the till. The order is what makes it hold."
          - "Keep first: move the saving out before the spending money is in front of you."
          - "Review it when your money changes, not every week."
        examples:
          - "EC$200 from a Saturday job: EC$50 out first, and the rest is genuinely spendable."
        joke: "A plan you rewrite every week is a diary, not a plan."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "A plan is one decision made in the calm, instead of many made at the till."
          - "Keep first. What is left after keeping is the part that is genuinely free."
          - "Let them do the splitting themselves: the deciding is the lesson, not the amount."
        examples:
          - "Three tins at home, and your child divides the pocket money between them."
          - "At the shop: one treat chosen, one coin kept, and they choose which."
        joke: "Little by little, the bird builds its nest."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The objective is the split AND the reasoning, not arriving at one correct answer."
          - "Deciding in advance is the transferable habit; the proportions are secondary."
          - "Mark the explanation rather than the arithmetic. A defended split is the evidence."
        examples:
          - "Three labelled tins and play EC$: pairs divide, then defend the split to the class."
          - "Lower Secondary: divide a Saturday-job wage, compare splits, argue for one."
        joke: "State the split, then defend it. The defending is where the marks live."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "A plan is what turns an amount into a month. Without one, the money decides."
          - "Keep first, then what you owe, and what is left is genuinely yours."
          - "Money here is seasonal. Plan the thin months during the good ones."
        examples:
          - "Set the keeping aside in Carnival season, so the September light bill is no shock."
        joke: "We all become accountants when the light bill comes."
    teach_points:
      "adult":
        - "A plan is what turns an amount into a month. Without one, the money decides."
        - "Keep first, then what you owe, and what is left is genuinely yours."
        - "Money here is seasonal. Plan the thin months during the good ones."
      "5-8":
        - "A plan says where your money goes before you get it."
        - "Keep some. Spend some. Share some."
        - "Money can run out. So needs come first."
      "9-12":
        - "A plan for your money says where each part goes before it arrives."
        - "One easy plan: keep some, spend some, share some."
        - "There is no single right split -- but deciding beforehand beats deciding at the shop."
      "13-15":
        - "Decide the split on payday, not at the till. The order is what makes it hold."
        - "Keep first: move the saving out before the spending money is in front of you."
        - "Review it when your money changes, not every week -- a plan you rewrite constantly is not a plan."
      "16-18":
        - "A plan is what turns an amount into a month. Without one, the money decides."
        - "Keep first, then the fixed things you owe, then what is left is genuinely yours."
        - "Money here is seasonal. Plan the thin months in the good ones, not in September."
    examples:
      "5-8":
        - "You have three coins. One to keep, one to spend, one to share."
        - "Grandma gives you six dollars at Christmas. Two to keep, three to spend, one for your brother."
      "9-12":
        - "You get EC$10 for helping out. EC$4 kept, EC$5 spent, EC$1 shared with your little sister."
        - "Christmas money is EC$50. Half kept for the bicycle, half for gifts."
      "13-15":
        - "EC$200 from a Saturday job: EC$80 to the account, EC$100 to spend, EC$20 towards a gift for your mother."
        - "You earn more in December than in February -- keep the same percentage, not the same amount."
      "16-18":
        - "EC$900 in a good month and EC$400 in a quiet one. Plan on the EC$400 and treat the rest as a good month."
        - "Sugar Mas work pays in January. School costs land in September. The plan is what carries one to the other."
    # `proportion`, not `allocator`: this lesson is now open from 5-8 and
    # BAND_KINDS["5-8"] does not permit an allocator. Three tins is a
    # proportion; the allocator is the same idea with a control a
    # five-year-old cannot drive. (l02 has the same mismatch and is left
    # alone here -- it is pre-existing and not this patch's to change.)
    suggested_widget_kind: proportion
    check_questions:
      - id: q1_when_to_decide
        prompt:
          # WAS "You have three coins. Your plan says keep one. How many can you
          # spend?" -- a counting question, sharing the options of a WHEN
          # question. A five-year-old was shown three timing chips and a hint
          # ladder ending "Two. One kept, two to use", which is not on screen.
          # `options` is one list for every band, so the 5-8 prompt has to ask
          # what the options answer.
          "5-8": "When do you put your keeping coin in the tin?"
          "9-12": "When is the best time to decide how much to keep?"
          "13-15": "When should the split be decided?"
          "16-18": "In a month you know will be thin, what gets decided first?"
        options: ["Before you spend any", "At the shop", "At the end of the week"]
        answer: 0
        hints:
          "5-8":
            - "Think about which coin moves first."
            - "It is one of these two: before you spend, or at the shop?"
            - "Before you spend any. The tin coin goes in first. Then you spend the rest."
          "9-12":
            - "Think about what is left at the end of a week when you did not decide first."
            - "It is one of these two: before you spend, or at the shop?"
            - "Before you spend any! It is much easier to keep money you have not already got in your hand."
          "13-15":
            - "Think about which order actually leaves something to save."
            # WAS "before, or at the end of the week?" -- options 0 and 2, while
            # `narrow_options` renders 0 and 1. The reader was told to choose
            # between two things and shown a different two.
            - "One of these two: before you spend, or at the shop?"
            - "Before. Keeping first is the whole method -- what is left at the end of a week is usually nothing."
          "16-18":
            - "Which decision, made late, costs you the most?"
            - "One of these two: before anything moves, or at the shop?"
            - "Before. In a thin month the plan is the only thing standing between you and the till."

      - id: q2_explain_plan
        prompt:
          "5-8": "Tell Skye your plan for three coins. Where does each one go?"
          "9-12": "Tell me your own plan for EC$10. Where would each part go?"
          "13-15": "Describe your own split, and say why."
          "16-18": "Give me your split for a thin month and a good one, and say what changes."
        graded: false
        accept: [keep, save, spend, share, account, gift, goal, half, some]

    guide:
      educator:
        "5-8":
          timing_minutes: 35
          materials: ["Three labelled tins or cups -- keep, spend, share", "Play coins"]
          misconceptions:
            - wrong: "They split evenly because even feels fair."
              say: "Fair is not the same as planned. What are you keeping it FOR?"
            - wrong: "They choose what to buy first, then see what is left to keep."
              say: "You picked the spending first. Try it the other way round."
          extension: "Give them six coins instead of three and ask them to explain the change."
        "9-12":
          timing_minutes: 30
          materials: ["Play money in EC$1 and EC$5"]
          misconceptions:
            - wrong: "They decide the split at the shop rather than before."
              say: "Notice when you decided. What was left by then?"
            - wrong: "They think there is one correct split and look for it."
              say: "There is not one. Defend yours instead."
          extension: "Ask them to redo the split for EC$50 and say which parts did not simply scale."
        "13-15":
          timing_minutes: 30
          materials: []
          misconceptions:
            - wrong: "They keep the same amount when the income changes, not the same share."
              say: "December and February are not the same month. What should have moved?"
            - wrong: "They rewrite the plan every week and call it flexibility."
              say: "A plan you rewrite constantly is not a plan. What would make you change it?"
          extension: "Ask for a plan that survives a month with no work in it."
      guardian:
        "5-8":
          doing: "Splitting money three ways -- keep, spend, share -- and saying why."
          do_together: "Give them three coins and three places to put them. Do not correct it until after."
          ask_them: "Which one did you keep, and what is it for?"
          got_it_sounds_like: "They name a reason for the kept coin, not just a number."
        "9-12":
          doing: "Deciding where money goes before it arrives, instead of at the shop."
          do_together: "Next time they get money, ask them to say the split out loud before you go anywhere."
          ask_them: "What did you decide to keep, and what for?"
          got_it_sounds_like: "They name an amount AND a reason, and they decided it before leaving the house."
        "13-15":
          doing: "Keeping first, and holding a plan when the money changes."
          do_together: "Ask what their split would be on EC$200, then on EC$60, and listen for what moved."
          ask_them: "When your money drops, do you keep the same amount or the same share?"
          got_it_sounds_like: "They say share, and they can explain why the amount is the wrong thing to hold."

  # ── 6. Money habits ─────────────────────────────────────────────────────
  - id: l06_money_habits
    module_id: module_01_saving
    concept_id: habit
    order: 6
    objective: The learner can name one money habit of their own and one small change that makes keeping money automatic.
    # ── the six voices ───────────────────────────────────────────────────
    persona_voice:
      stella:
        band: "5-8"
        role: learner
        tone: "warm, simple, praise"
        teach_points:
          - "A habit is a thing you do every time, without thinking hard."
          - "Feeding the tin on the same day makes keeping easy."
          - "Little and often beats big and once."
        examples:
          - "Every Saturday, one coin goes in the tin before anything else."
        joke: "My tin eats every Saturday. It is never full and never complains."
      kaleb:
        band: "9-12"
        role: learner
        tone: "friendly, a bit of swagger"
        teach_points:
          - "A habit is money on autopilot -- decided once, done every week."
          - "Same day, same amount, before the spending starts. That is the whole trick."
          - "The habit is the machine; the amount can be small."
        examples:
          - "EC$3 into the account every Friday, before the shop. Sixty-plus dollars by end of term without feeling it."
        joke: "Willpower takes a day off. A habit clocks in anyway."
      orion:
        band: "13-15"
        role: learner
        tone: "dry, plain"
        teach_points:
          - "Habits beat willpower because they remove the decision."
          - "Attach the keeping to something that already happens: allowance day, job day."
          - "Track it somewhere you can see; a visible streak protects itself."
        examples:
          - "Saturday job pays, EC$20 moves before you leave the yard. No decision, no leak."
        joke: "A streak is the only judge you cannot argue with."
      aurora:
        band: "adult"
        role: parent
        tone: "warm, practical, proverb"
        teach_points:
          - "Children copy the habit they can SEE. Feed the tin in front of them."
          - "Tie their keeping to a fixed day, and let them do the moving themselves."
          - "Praise the streak, not the sum -- the habit is the inheritance."
        examples:
          - "Sunday evening, everyone's tin gets fed, yours included. It becomes what this family does."
        joke: "What you do on payday teaches louder than what you say on Sunday."
      nova:
        band: "adult"
        role: educator
        tone: "colleague to colleague, practical"
        teach_points:
          - "The objective is behavioural: one named habit and one named change, per learner."
          - "Anchor new habits to existing routines -- arrival, register, Friday close."
          - "Mark consistency over amount: a four-week streak of EC$1 outranks one EC$20."
        examples:
          - "A class savings chart: each learner logs their keep-day weekly, streaks visible to all."
        joke: "Grade the streak and watch attendance at the habit improve."
      guest:
        band: "adult"
        role: learner
        tone: "friendly, local"
        teach_points:
          - "You do not need more discipline; you need fewer decisions. Automate the keep."
          - "Same day as the pay lands, the keeping moves. A standing order never forgets."
          - "One visible streak -- an app, a book, a calendar -- keeps the habit honest."
        examples:
          - "Payday standing order: EC$100 gone to savings before the weekend can find it."
        joke: "The best saver in the house is the standing order. It has no feelings."
    teach_points:
      "adult":
        - "The gap is rarely knowledge -- it is the habit. Decide once, automate, and stop re-deciding."
        - "Anchor keeping to payday: what moves first never gets spent."
        - "Make the streak visible. A run you can see is a run you protect."
      "5-8":
        - "A habit is a thing you do every time, without thinking hard."
        - "Feeding the tin on the same day makes keeping easy."
        - "Little and often beats big and once."
      "9-12":
        - "A habit is a decision made once that then works every week."
        - "Same day, same amount, before the spending starts."
        - "Small amounts on a schedule beat big amounts on a promise."
      "13-15":
        - "Habits beat willpower because they remove the decision."
        - "Attach the keeping to something that already happens -- allowance day, job day."
        - "Track it visibly; a streak you can see is a streak you protect."
      "16-18":
        - "Willpower is a budget that runs out; a habit spends none of it."
        - "Move the keeping the day money arrives -- pay yourself first, literally first."
        - "Streaks and automation carry you through the thin months willpower would not."
    examples:
      "5-8":
        - "Every Saturday morning, one coin in the tin before play."
        - "The tin lives where you can see it, so you remember to feed it."
      "9-12":
        - "EC$3 every Friday before the shop. By end of term that is real money, and it never hurt."
        - "A tick on the calendar every week you fed the account. Try to keep the row unbroken."
      "13-15":
        - "Saturday job pays EC$80: EC$20 moves the same day, every time, before anything else."
        - "Six ticks in a row on your phone. Week seven, you keep the run alive."
      "16-18":
        - "First job: a standing order moves EC$150 the day pay lands. You never meet that money as spendable."
        - "December pays double; the HABIT stays the same percentage, so the thin months are already covered."
    suggested_widget_kind: timeline
    check_questions:
      - id: q1_when_does_it_move
        prompt:
          "5-8": "When does your keeping coin go in the tin?"
          "9-12": "When should the keeping money move?"
          "13-15": "When does the keep-money move, if you want it to actually happen?"
          "16-18": "Pay lands today. When does the keeping move?"
        options: ["Same day, first thing", "Whenever I remember", "At the end of the month"]
        answer: 0
        hints:
          "5-8":
            - "Think about feeding the tin before play, every Saturday."
            - "It is one of these two: first thing, or when you remember?"
            - "First thing! Same day, every time -- that is what makes it a habit."
          "9-12":
            - "Think about which one still happens on a busy week."
            - "It is one of these two: first thing, or when you remember?"
            - "Same day, first thing. Remembering is a plan; a habit does not need one."
          "13-15":
            - "Think about which option removes the decision."
            - "One of these two: first thing, or end of the month?"
            - "Same day, first thing. What waits until month-end meets an empty pocket."
          "16-18":
            - "Which option never meets the money as spendable?"
            - "One of these two: first thing, or end of the month?"
            - "Same day, first thing -- pay yourself first. Month-end keeping is whatever is left, which is usually nothing."
      - id: q2_name_your_habit
        prompt:
          "5-8": "Tell Skye your tin day. Which day feeds the tin?"
          "9-12": "Name your keep-day, and what moves on it."
          "13-15": "Name one money habit you could start this week, and its trigger."
          "16-18": "Name the habit, the trigger, and the amount. All three."
        graded: false
        accept: [saturday, sunday, monday, friday, payday, allowance, week, every, day, tin, account, move, keep]

    guide:
      educator:
        "5-8":
          timing_minutes: 30
          materials: ["The class tin", "A wall calendar and stickers"]
          misconceptions:
            - wrong: "They think a habit has to be big to count."
              say: "One coin, every Saturday, beats ten coins once. The every-time is the habit."
            - wrong: "They wait to feel like doing it."
              say: "Habits are for the days you do not feel like it. That is their whole job."
          extension: "A class tin fed every Friday, with a sticker for every unbroken week."
        "9-12":
          timing_minutes: 25
          materials: ["A streak chart per learner"]
          misconceptions:
            - wrong: "They restart the whole plan after one missed week."
              say: "A missed week is a gap, not a failure. The streak starts again the same day."
          extension: "Four-week streak challenge: consistency scores, amounts do not."
        "13-15":
          timing_minutes: 25
          materials: []
          misconceptions:
            - wrong: "They rely on motivation and call the plan broken when it dips."
              say: "Motivation dips are the design case. Anchor the habit to a day, not a mood."
          extension: "Each learner names habit + trigger + amount and reports the streak in four weeks."
      guardian:
        "5-8":
          doing: "Learning that keeping money works best as a same-day-every-time habit."
          do_together: "Pick the tin day together and feed it at the same moment each week."
          ask_them: "What day does the tin eat?"
          got_it_sounds_like: "They remind YOU it is tin day."
        "9-12":
          doing: "Learning to put keeping on a schedule instead of a promise."
          do_together: "Set the keep-day and mark every kept week on the calendar."
          ask_them: "How long is the streak now?"
          got_it_sounds_like: "They protect the streak without being reminded."
        "13-15":
          doing: "Learning to anchor keeping to a trigger -- job day, allowance day."
          do_together: "Let them choose the trigger and the amount; you only ask about the streak."
          ask_them: "What is the trigger, and did it fire this week?"
          got_it_sounds_like: "They describe the habit as a system, not an intention."
