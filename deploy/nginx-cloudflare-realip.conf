# Restore the visitor's real address when Cloudflare is in front.
#
# Install (http context, so it applies to every server block including the
# ones certbot rewrites):
#   sudo cp deploy/nginx-cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why this is not optional on this deployment.
#
# aspire.eccugenai.app is a proxied (orange-cloud) Cloudflare record, so every
# connection nginx accepts comes from a Cloudflare edge address. Without the
# block below, `$remote_addr` is that edge address, and `proxy_params` sets
#
#     X-Forwarded-For: $proxy_add_x_forwarded_for      # "<client>, <cf-edge>"
#
# `client_ip()` in app/auth.py reads the RIGHTMOST entry -- correct, because
# that is the only one an attacker cannot write -- and so would see the edge
# address. Every visitor on the planet would then share one bucket for
# ANONYMOUS_SESSIONS_PER_IP_PER_HOUR and for the voice limiter in
# app/voice/router.py. The first few users of the day would spend the limit and
# everyone after them would be refused.
#
# With `real_ip_header CF-Connecting-IP`, nginx rewrites `$remote_addr` to the
# true client before `$proxy_add_x_forwarded_for` is expanded, so the header
# becomes "<client>, <client>" and the rightmost entry is the real address.
# That also fixes uvicorn's --proxy-headers view of `request.client.host`,
# which app/voice/router.py uses directly.
#
# `set_real_ip_from` is what makes this safe: CF-Connecting-IP is honoured only
# on connections that actually came from one of these ranges. A direct hit on
# the origin IP carrying a forged CF-Connecting-IP is ignored.

# --- Cloudflare IPv4 ---------------------------------------------------------
# Refresh with: curl -s https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ---------------------------------------------------------
# Refresh with: curl -s https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP holds exactly one address that Cloudflare wrote itself, so
# there is no chain to walk and `real_ip_recursive` is left off. Using
# X-Forwarded-For here instead would reintroduce the spoofing problem, because
# a client can put anything in the left of that header before Cloudflare
# appends to it.
real_ip_header CF-Connecting-IP;
