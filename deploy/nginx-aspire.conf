# ASPIRE — single origin for the app and the API.
#
# Serving both from one hostname is not just tidy: it makes every API call
# same-origin, so the browser never preflights and the backend's CORS settings
# stop mattering. Split them across two hostnames and you must set
# CORS_ALLOW_ORIGINS in backend/.env to the app's origin.
#
# Install:
#   sudo cp deploy/nginx-aspire.conf /etc/nginx/sites-available/aspire
#   sudo ln -s /etc/nginx/sites-available/aspire /etc/nginx/sites-enabled/
#   sudo cp deploy/nginx-cloudflare-realip.conf \
#           /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is obtained with `certbot certonly --webroot -w /var/www/acme`
# and the paths are written below by hand. That is deliberate: `certbot --nginx`
# edits this file in place, so the copy in git and the copy nginx reads drift
# apart, and the next `cp` from the repo silently reverts the certificate paths.
# `certonly` never touches it. See deploy/README.md section 7.

server {
    listen 80;
    listen [::]:80;
    server_name aspire.eccugenai.app;

    # ACME HTTP-01 challenges, on a webroot of their own.
    #
    # Deliberately NOT the client bundle's root: deploy/update.sh swaps that
    # symlink between client.a and client.b, so a challenge file written there
    # can vanish mid-validation. /var/www/acme is never touched by a deploy.
    #
    # `^~` so this wins over the regex asset locations in the :443 block below,
    # where these requests actually land -- Cloudflare's "Always Use HTTPS"
    # redirects the challenge to HTTPS before it ever reaches this server block.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Everything else on :80 goes to HTTPS.
    #
    # Cloudflare already forces this at the edge, so in normal operation no
    # visitor reaches here. It matters for the traffic that does not come
    # through Cloudflare: the origin IP is discoverable, and without this a
    # direct request would be served, and answered, in plaintext.
    #
    # The ACME location above is `^~`, so it still wins over this and renewals
    # are not redirected into a loop.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... ssl http2` rather than the newer standalone `http2 on;`:
    # Ubuntu 24.04 ships nginx 1.24, and `http2 on;` did not arrive until
    # 1.25.1 -- on 1.24 it is not a warning but `unknown directive`, which
    # fails `nginx -t` and takes the whole site down on reload. This form works
    # on both; 1.25+ only deprecates it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aspire.eccugenai.app;

    # A bootstrap self-signed pair, so `nginx -t` passes and :443 answers on a
    # box that has no certificate yet. Leaving these commented out is not an
    # option: `listen ... ssl` with no `ssl_certificate` is a hard config error,
    # so nginx would refuse to start at all and Cloudflare would keep serving
    # 521 -- which is exactly the state this deployment was found in.
    #
    # Generate the pair with:
    #   sudo install -d -m 700 /etc/ssl/aspire
    #   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
    #        -keyout /etc/ssl/aspire/privkey.pem \
    #        -out    /etc/ssl/aspire/fullchain.pem \
    #        -subj "/CN=aspire.eccugenai.app" \
    #        -addext "subjectAltName=DNS:aspire.eccugenai.app"
    #
    # Then REPLACE them with a real certificate -- certbot rewrites these two
    # lines itself, or point them at a Cloudflare Origin certificate. A
    # self-signed cert is accepted by Cloudflare only in "Full" mode, not
    # "Full (strict)". See deploy/README.md section 7.
    ssl_certificate     /etc/letsencrypt/live/aspire.eccugenai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aspire.eccugenai.app/privkey.pem;

    # The API caps voice uploads at 25 MB itself. nginx defaults to 1 MB and
    # would reject a recording with its own 413 before FastAPI ever sees it —
    # which reaches the user as the unhelpful "Voice is offline" note.
    client_max_body_size 25m;

    # --- compression --------------------------------------------------------
    # Measured first load before this block: 545.2 KB raw. With gzip: 160.9 KB.
    # With brotli: 140.5 KB. On the mid-tier Android / Fast 3G target that is
    # roughly seven seconds of transfer saved on every cold load.
    #
    # `gzip_types` is the line that matters and the reason a distro's `gzip on;`
    # in nginx.conf was not already doing this: its default is `text/html` and
    # nothing else, so JavaScript and CSS -- 469 of those 545 KB -- were being
    # served raw even where gzip appeared to be enabled.
    #
    # `gzip_proxied any` is the second: the SSR document comes from Node on
    # :3000, and nginx does not compress proxied responses by default at all.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        text/css
        text/plain
        image/svg+xml;

    # Brotli is a further 13% smaller than gzip on this bundle (140.5 vs 160.9
    # KB). It needs the ngx_brotli module, which is not in Debian's stock nginx,
    # so both directives stay commented until the module is installed -- an
    # unknown directive is a hard nginx config error, not a warning, and would
    # take the site down on reload.
    #
    #   sudo apt install libnginx-mod-brotli   # or build ngx_brotli
    #
    # `brotli_static on` serves a pre-compressed `.br` beside each asset when
    # one exists, which costs nothing at request time.
    #
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types application/javascript text/javascript application/json
    #              application/manifest+json text/css text/plain image/svg+xml;

    # Renewals arrive here, not on :80 — see the note in the :80 block.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Built client assets, served from disk rather than through Node.
    #
    # This is deliberately NOT frontend/dist/client. `vite build` empties its
    # output directory before it writes, so pointing nginx there would 404 every
    # asset for the length of a build. deploy/update.sh builds first and then
    # swaps this symlink between two slots in one rename, so a deploy is
    # invisible and a failed build leaves the previous bundle serving.
    root /aspire-web/client;

    # Filenames are content-hashed, so a stale copy is impossible.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /brand/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Ubuntu's /etc/nginx/mime.types has no .webmanifest entry, so nginx serves
    # it as application/octet-stream -- which is why `application/manifest+json`
    # in `gzip_types` above never matched, and why some browsers decline to
    # apply the manifest at all.
    #
    # Fixed here, in an exact-match location, and NOT with a server-level
    # `types { ... }` block. A `types` block REPLACES the inherited map rather
    # than extending it: adding one line that way silently turns every other
    # asset in this server -- the JavaScript, the CSS, the fonts, the images --
    # into application/octet-stream. An exact `=` location also beats the regex
    # block below, so the cache policy is restated here.
    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Favicons and anything else that must live at the root sit directly in
    # dist/client. They are matched by the `try_files` in the catch-all below;
    # this block only exists to give them a cache policy.
    location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|android-chrome-\d+x\d+\.png|site\.webmanifest|robots\.txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- API ---------------------------------------------------------------
    # A reply is several model calls deep and the client waits 90 seconds for
    # it. nginx defaults to a 60s read timeout and would cut off an answer that
    # was still being written.
    #
    # `proxy_buffering off` is belt and braces (P14-D): the app already sends
    # `X-Accel-Buffering: no` on every SSE response and nginx honours it
    # per-response, but that protection lives in application code where a
    # refactor can lose it silently. Stated here too, the streaming path does
    # not depend on a header nobody tests for. Note `text/event-stream` is not
    # in `gzip_types` above, deliberately -- gzip buffers, which is the one
    # outcome that makes streaming pointless.
    #
    # This block used to be `location /chat`, which is now a path the backend
    # does not serve: the wire moved to `POST /v2/chat/stream` (app/api/stream.py
    # mounts the router at `/v2`). Nothing here matched it, so every message fell
    # through to the catch-all below and was answered by the SSR renderer, which
    # has no such route. The chat was broken in production on the old config --
    # if you are re-adding a `/chat` rule, check the router prefix first.
    location /v2/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # /v2/documents/presign hands the browser a signed URL and the bytes go
        # straight to S3, so nothing large transits here -- but the request body
        # is streamed rather than buffered for the same reason as /api/ below.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Covers the voice, games, eligibility, conversations, session and title
    # routes -- and the admin API, which is mounted at `/api/admin` precisely so
    # that this one rule catches it. The portal's PAGES are at `/admin/*` and are
    # rendered by the SSR block at the bottom; the two must not share a prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        # Transcribe and speak allow themselves 20s client-side; the cap here is
        # generous so a slow upstream fails on its own terms with a real message.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        # /api/voice/speak-stream delivers audio chunks as the vendor makes
        # them (P14-C); buffered, first audio would wait for last again.
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # /health is intentionally NOT exposed. Nothing in the browser calls it;
    # check it over loopback on the box instead.

    # --- Everything else ----------------------------------------------------
    # The document root is always rendered, never read from disk: there is no
    # index.html, and letting try_files see a bare "/" would match the directory
    # and return 403.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
    }

    # Any other path: serve it from disk if it exists, otherwise render it. This
    # is what picks up a new root-level asset without another nginx edit.
    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
    }
}
